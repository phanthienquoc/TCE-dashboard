apiVersion: apps/v1
kind: Deployment
metadata:
  name: tce-service
  namespace: tce-prod
spec:
  replicas: 1
  selector: { matchLabels: { app: tce-service } }
  template:
    metadata: { labels: { app: tce-service } }
    spec:
      containers:
        - name: service
          image: tce-service:prod
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8210 }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: '8210' }
            - {
                name: SUPABASE_URL,
                valueFrom: { secretKeyRef: { name: tce-app-secrets, key: SUPABASE_URL } },
              }
            - {
                name: SUPABASE_SERVICE_ROLE_KEY,
                valueFrom:
                  { secretKeyRef: { name: tce-app-secrets, key: SUPABASE_SERVICE_ROLE_KEY } },
              }
            - {
                name: JWT_SECRET,
                valueFrom: { secretKeyRef: { name: tce-app-secrets, key: JWT_SECRET } },
              }
            - { name: JWT_REFRESH_TTL_SECONDS, value: '2592000' }
            - {
                name: MFA_ENCRYPTION_KEY,
                valueFrom: { secretKeyRef: { name: tce-auth, key: MFA_ENCRYPTION_KEY } },
              }
            - {
                name: TCE_CREDENTIAL_ENCRYPTION_KEY,
                valueFrom: { secretKeyRef: { name: tce-auth, key: TCE_CREDENTIAL_ENCRYPTION_KEY } },
              }
          readinessProbe:
            {
              httpGet: { path: /api/health, port: http },
              initialDelaySeconds: 5,
              timeoutSeconds: 2,
              periodSeconds: 10,
              failureThreshold: 3,
            }
          livenessProbe:
            {
              httpGet: { path: /api/health, port: http },
              initialDelaySeconds: 15,
              timeoutSeconds: 2,
              periodSeconds: 20,
              failureThreshold: 3,
            }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: tce-service, namespace: tce-prod }
spec:
  selector: { app: tce-service }
  ports: [{ port: 8210, targetPort: http }]
