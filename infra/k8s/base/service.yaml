apiVersion: apps/v1
kind: Deployment
metadata:
  name: tce-service
  namespace: tce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tce-service
  template:
    metadata:
      labels:
        app: tce-service
    spec:
      containers:
        - name: service
          image: ghcr.io/phanthienquoc/tce-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8210
          envFrom:
            - secretRef:
                name: tce-service-env
          readinessProbe:
            httpGet:
              path: /auth/status
              port: 8210
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /auth/status
              port: 8210
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tce-service
  namespace: tce
spec:
  selector:
    app: tce-service
  ports:
    - port: 8210
      targetPort: 8210
  type: ClusterIP
