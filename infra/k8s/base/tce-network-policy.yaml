apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tce-default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tce-allow-frontend-and-service
spec:
  podSelector:
    matchLabels:
      app: tce-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: tce-frontend
      ports:
        - protocol: TCP
          port: 8210
    - ports:
        - protocol: TCP
          port: 8210
