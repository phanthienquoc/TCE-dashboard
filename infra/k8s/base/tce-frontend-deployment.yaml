apiVersion: apps/v1
kind: Deployment
metadata:
  name: tce-frontend
  labels:
    app: tce-frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: tce-frontend
  template:
    metadata:
      labels:
        app: tce-frontend
    spec:
      containers:
        - name: frontend
          image: tce-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tce-frontend
spec:
  type: ClusterIP
  selector:
    app: tce-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
