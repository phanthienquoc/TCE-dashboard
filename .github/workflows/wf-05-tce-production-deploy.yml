name: "WF-05 TCE Production Deploy"

"on":
  workflow_call:
    inputs:
      host:
        required: false
        type: string
        default: "132.226.175.206"
      username:
        required: false
        type: string
        default: "ubuntu"
    secrets:
      VPS_SSH_PRIVATE_KEY:
        required: true
      SUPABASE_URL_PROD:
        required: true
      SUPABASE_SERVICE_ROLE_KEY_PROD:
        required: true
      JWT_SECRET_PROD:
        required: true
  workflow_dispatch:
    inputs:
      host:
        description: "VPS IP/hostname"
        required: true
        default: "132.226.175.206"
        type: string
      username:
        description: "SSH username"
        required: true
        default: "ubuntu"
        type: string
      confirm:
        description: "Type DEPLOY-TCE-PROD to confirm"
        required: true
        default: ""
        type: string

env:
  ENV_NAME: "prod"
  NAMESPACE: "tce-prod"

jobs:
  deploy-production:
    if: ${{ github.event_name == 'workflow_call' || inputs.confirm == 'DEPLOY-TCE-PROD' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build FE + BE images
        run: |
          set -euo pipefail
          docker build --pull -t tce-frontend:prod -f apps/web/Dockerfile apps/web
          docker build --pull -t tce-service:prod -f apps/service/Dockerfile apps/service
          docker image inspect tce-frontend:prod >/dev/null
          docker image inspect tce-service:prod >/dev/null
          docker save tce-frontend:prod tce-service:prod | gzip > /tmp/tce-prod-images.tar.gz
      - name: Configure SSH
        env:
          KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key
          ssh-keygen -y -f ~/.ssh/tce_vps_key >/dev/null
      - name: Deploy to k3s PROD
        env:
          H: ${{ inputs.host || '132.226.175.206' }}
          U: ${{ inputs.username || 'ubuntu' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PROD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_PROD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          test -n "$JWT_SECRET"
          scp -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no /tmp/tce-prod-images.tar.gz "$U@$H:/tmp/tce-prod-images.tar.gz"
          scp -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no infra/k3s/service-prod.yaml infra/k3s/frontend-prod.yaml "$U@$H:/tmp/"
          ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$U@$H" "SUPABASE_URL='$SUPABASE_URL' SUPABASE_KEY='$SUPABASE_KEY' JWT_SECRET='$JWT_SECRET' bash -s" <<'REMOTE'
          set -euo pipefail
          sudo k3s ctr images import /tmp/tce-prod-images.tar.gz
          sudo kubectl -n tce-prod create secret generic tce-app-secrets --from-literal=SUPABASE_URL="$SUPABASE_URL" --from-literal=SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_KEY" --from-literal=JWT_SECRET="$JWT_SECRET" --dry-run=client -o yaml | sudo kubectl apply -f -
          sudo kubectl apply -f /tmp/service-prod.yaml -f /tmp/frontend-prod.yaml
          sudo kubectl -n tce-prod rollout status deployment/tce-service --timeout=180s
          sudo kubectl -n tce-prod rollout status deployment/tce-frontend --timeout=180s
          sudo kubectl -n tce-prod get pods,svc,ingress
          rm -f /tmp/tce-prod-images.tar.gz /tmp/service-prod.yaml /tmp/frontend-prod.yaml
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/tce_vps_key /tmp/tce-prod-images.tar.gz
