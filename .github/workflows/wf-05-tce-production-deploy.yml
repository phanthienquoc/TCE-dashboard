name: "WF-05 TCE Production Deploy"

on:
  workflow_call:
    inputs:
      host:
        required: false
        type: string
        default: "132.226.175.206"
      username:
        required: false
        type: string
        default: "ubuntu"
    secrets:
      VPS_SSH_PRIVATE_KEY:
        required: true
      SUPABASE_URL:
        required: true
      SUPABASE_SERVICE_ROLE_KEY:
        required: true
      JWT_SECRET:
        required: true
      MFA_ENCRYPTION_KEY:
        required: true
  workflow_dispatch:
    inputs:
      host:
        description: "VPS IP/hostname"
        required: true
        default: "132.226.175.206"
        type: string
      username:
        description: "SSH username"
        required: true
        default: "ubuntu"
        type: string
      confirm:
        description: "Type DEPLOY-TCE-PROD to confirm"
        required: true
        default: ""
        type: string

env:
  ENV_NAME: "prod"
  NAMESPACE: "tce-prod"

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build FE + BE images
        run: |
          set -euo pipefail
          docker build --pull -t tce-frontend:prod -f Dockerfile .
          docker build --pull -t tce-service:prod -f apps/service/Dockerfile .
          docker image inspect tce-frontend:prod >/dev/null
          docker image inspect tce-service:prod >/dev/null
          docker save tce-frontend:prod tce-service:prod | gzip > /tmp/tce-prod-images.tar.gz
      - name: Configure SSH
        env:
          KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key
          ssh-keygen -y -f ~/.ssh/tce_vps_key >/dev/null
      - name: Deploy to k3s PROD
        env:
          H: ${{ inputs.host || '132.226.175.206' }}
          U: ${{ inputs.username || 'ubuntu' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MFA_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
          IMAGE_TAG: prod-v0.1.0-${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          test -n "$JWT_SECRET"
          test -n "$MFA_KEY"

          SSH_OPTS=(-i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15)

          echo "=== SSH PREFLIGHT ==="
          ssh "${SSH_OPTS[@]}" "$U@$H" 'echo "SSH_OK"; hostname; whoami; sudo -n true'

          echo "=== UPLOAD ARTIFACTS ==="
          scp "${SSH_OPTS[@]}" /tmp/tce-prod-images.tar.gz "$U@$H:/tmp/tce-prod-images.tar.gz"
          scp "${SSH_OPTS[@]}" infra/k3s/service-prod.yaml infra/k3s/frontend-prod.yaml "$U@$H:/tmp/"

          echo "=== VERIFY REMOTE ARTIFACTS ==="
          ssh "${SSH_OPTS[@]}" "$U@$H" 'set -euo pipefail; test -s /tmp/tce-prod-images.tar.gz; test -s /tmp/service-prod.yaml; test -s /tmp/frontend-prod.yaml; ls -lh /tmp/tce-prod-images.tar.gz /tmp/service-prod.yaml /tmp/frontend-prod.yaml'

          ssh "${SSH_OPTS[@]}" "$U@$H" "SUPABASE_URL='$SUPABASE_URL' SUPABASE_KEY='$SUPABASE_KEY' JWT_SECRET='$JWT_SECRET' MFA_KEY='$MFA_KEY' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          cleanup() {
            rm -f /tmp/tce-prod-images.tar.gz /tmp/service-prod.yaml /tmp/frontend-prod.yaml
          }
          trap cleanup EXIT

          NS=tce-prod
          echo "=== VERIFY VPS DISK ==="
          df -h /
          sudo kubectl get namespace "$NS" >/dev/null 2>&1 || sudo kubectl create namespace "$NS"

          echo "=== VALIDATE IMAGE ARCHIVE ==="
          tar -tzf /tmp/tce-prod-images.tar.gz >/dev/null

          echo "=== REMOVE LEGACY TCE NGINX ROUTING ==="
          for DOMAIN in tce.mrcute.space tce-stg.mrcute.space; do
            sudo rm -f "/etc/nginx/sites-enabled/${DOMAIN}" "/etc/nginx/sites-available/${DOMAIN}"
          done
          sudo rm -rf /var/backups/tce-nginx /var/www/tce-acme
          if command -v certbot >/dev/null 2>&1; then
            for DOMAIN in tce.mrcute.space tce-stg.mrcute.space; do
              sudo certbot delete --cert-name "$DOMAIN" --non-interactive 2>/dev/null || true
            done
          fi
          if systemctl is-active --quiet nginx; then
            sudo nginx -t
            sudo systemctl disable --now nginx
          fi

          echo "=== IMPORT IMAGES ==="
          sudo k3s ctr images import /tmp/tce-prod-images.tar.gz
          sudo kubectl -n "$NS" create secret generic tce-app-secrets --from-literal=SUPABASE_URL="$SUPABASE_URL" --from-literal=SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_KEY" --from-literal=JWT_SECRET="$JWT_SECRET" --dry-run=client -o yaml | sudo kubectl apply -f -
          CREDENTIAL_KEY="$(sudo kubectl -n "$NS" get secret tce-auth -o jsonpath='{.data.TCE_CREDENTIAL_ENCRYPTION_KEY}' 2>/dev/null | base64 -d || true)"
          if [ -z "$CREDENTIAL_KEY" ]; then
            CREDENTIAL_KEY="$(openssl rand -hex 32)"
            echo "Generated persistent TCE credential encryption key for production."
          else
            echo "Reusing existing TCE credential encryption key."
          fi
          sudo kubectl -n "$NS" create secret generic tce-auth --from-literal=MFA_ENCRYPTION_KEY="$MFA_KEY" --from-literal=TCE_CREDENTIAL_ENCRYPTION_KEY="$CREDENTIAL_KEY" --dry-run=client -o yaml | sudo kubectl apply -f -

          verify_image() {
            local image="$1"
            echo "Checking k3s image: $image"
            sudo k3s ctr images inspect "$image" >/dev/null
          }
          diagnostics() {
            local deployment="$1"
            echo "=== DIAGNOSTICS: $deployment ==="
            sudo kubectl -n "$NS" get deployment "$deployment" -o wide || true
            sudo kubectl -n "$NS" get pods -o wide || true
            sudo kubectl -n "$NS" describe deployment "$deployment" || true
            sudo kubectl -n "$NS" get pods -l "app=$deployment" -o name | while read -r pod; do
              echo "=== POD: $pod ==="
              sudo kubectl -n "$NS" describe "$pod" || true
              sudo kubectl -n "$NS" logs "$pod" --all-containers=true --tail=200 || true
              sudo kubectl -n "$NS" logs "$pod" --all-containers=true --previous --tail=200 || true
            done
            echo "=== EVENTS ==="
            sudo kubectl -n "$NS" get events --sort-by='.lastTimestamp' | tail -100 || true
          }
          deploy_and_wait() {
            local manifest="$1"
            local deployment="$2"
            local image="$3"
            test -s "$manifest"
            verify_image "$image"
            sudo kubectl apply -f "$manifest"
            if ! sudo kubectl -n "$NS" rollout status "deployment/$deployment" --timeout=180s; then
              diagnostics "$deployment"
              exit 1
            fi
          }

          deploy_and_wait /tmp/service-prod.yaml tce-service "docker.io/library/tce-service:$IMAGE_TAG"
          deploy_and_wait /tmp/frontend-prod.yaml tce-frontend "docker.io/library/tce-frontend:$IMAGE_TAG"

          echo "=== PRODUCTION STATUS ==="
          sudo kubectl -n "$NS" get pods,svc,ingress
          sudo kubectl -n "$NS" get certificate,secret 2>/dev/null || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/tce_vps_key /tmp/tce-prod-images.tar.gz