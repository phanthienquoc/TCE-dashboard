name: "WF-03 TCE Production Deploy"

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_PLATFORM: linux/arm64

jobs:
  build-frontend:
    name: Build frontend (native ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify native architecture
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          docker version
      - name: Validate frontend
        run: test -f Dockerfile
      - name: Build frontend image
        run: docker build --pull -t tce-frontend:prod -f Dockerfile .
      - name: Verify image architecture
        run: test "$(docker image inspect tce-frontend:prod --format '{{.Architecture}}')" = "arm64"
      - name: Export frontend image
        run: docker save tce-frontend:prod | gzip > /tmp/tce-frontend.tar.gz
      - name: Upload frontend image
        uses: actions/upload-artifact@v4
        with:
          name: tce-frontend-image
          path: /tmp/tce-frontend.tar.gz
          retention-days: 1

  build-backend:
    name: Build backend (native ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify native architecture
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          docker version
      - name: Validate backend
        run: |
          set -euo pipefail
          test -f apps/service/Dockerfile
          test -f tsconfig.base.json
          test -f nx.json
          test -d apps/service
          test -d libs
          test -d packages
      - name: Build backend image
        run: docker build --pull -t tce-service:prod -f apps/service/Dockerfile .
      - name: Verify image architecture
        run: test "$(docker image inspect tce-service:prod --format '{{.Architecture}}')" = "arm64"
      - name: Export backend image
        run: docker save tce-service:prod | gzip > /tmp/tce-service.tar.gz
      - name: Upload backend image
        uses: actions/upload-artifact@v4
        with:
          name: tce-service-image
          path: /tmp/tce-service.tar.gz
          retention-days: 1

  deploy-production:
    name: Deploy production
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      HOST: 132.226.175.206
      USERNAME: ubuntu
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify native architecture
        run: test "$(uname -m)" = "aarch64"

      - name: Validate production configuration
        run: |
          set -euo pipefail
          test -f infra/k3s/frontend-prod.yaml
          test -f infra/k3s/service-prod.yaml
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY JWT_SECRET MFA_ENCRYPTION_KEY VPS_SSH_PRIVATE_KEY; do
            value="${!name:-}"
            test -n "$value" || { echo "Missing GitHub secret: $name"; exit 1; }
          done

      - name: Download frontend image
        uses: actions/download-artifact@v4
        with:
          name: tce-frontend-image
          path: /tmp/images

      - name: Download backend image
        uses: actions/download-artifact@v4
        with:
          name: tce-service-image
          path: /tmp/images

      - name: Configure SSH
        env:
          KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key
          ssh-keygen -y -f ~/.ssh/tce_vps_key >/dev/null

      - name: Verify VPS access
        run: ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$USERNAME@$HOST" 'sudo kubectl get nodes'

      - name: Upload production bundle
        run: |
          set -euo pipefail
          scp -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
            /tmp/images/tce-frontend.tar.gz /tmp/images/tce-service.tar.gz \
            infra/k3s/frontend-prod.yaml infra/k3s/service-prod.yaml \
            "$USERNAME@$HOST:/tmp/"

      - name: Deploy production to k3s
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$USERNAME@$HOST" \
            "SUPABASE_URL='$SUPABASE_URL' SUPABASE_KEY='$SUPABASE_SERVICE_ROLE_KEY' JWT_SECRET='$JWT_SECRET' MFA_KEY='$MFA_ENCRYPTION_KEY' bash -s" <<'REMOTE'
          set -euo pipefail
          sudo kubectl get namespace tce-prod >/dev/null 2>&1 || sudo kubectl create namespace tce-prod
          sudo k3s ctr images import /tmp/tce-frontend.tar.gz
          sudo k3s ctr images import /tmp/tce-service.tar.gz
          sudo kubectl -n tce-prod create secret generic tce-app-secrets --from-literal=SUPABASE_URL="$SUPABASE_URL" --from-literal=SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_KEY" --from-literal=JWT_SECRET="$JWT_SECRET" --dry-run=client -o yaml | sudo kubectl apply -f -
          sudo kubectl -n tce-prod create secret generic tce-auth --from-literal=MFA_ENCRYPTION_KEY="$MFA_KEY" --dry-run=client -o yaml | sudo kubectl apply -f -
          sudo kubectl apply -f /tmp/service-prod.yaml -f /tmp/frontend-prod.yaml
          sudo kubectl -n tce-prod rollout status deployment/tce-service --timeout=180s
          sudo kubectl -n tce-prod rollout status deployment/tce-frontend --timeout=180s
          sudo kubectl -n tce-prod get pods,svc,ingress
          sudo kubectl -n tce-prod get certificate,secret 2>/dev/null || true
          rm -f /tmp/tce-frontend.tar.gz /tmp/tce-service.tar.gz /tmp/service-prod.yaml /tmp/frontend-prod.yaml
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -rf ~/.ssh/tce_vps_key /tmp/images
