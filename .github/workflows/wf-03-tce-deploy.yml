name: "WF-03 TCE Production Deploy"

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_PLATFORM: linux/arm64

jobs:
  detect:
    name: Resolve production image tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="prod-v${VERSION}-${SHA}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $IMAGE_TAG"

  build-frontend:
    name: Build frontend (native ARM64)
    needs: detect
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify native architecture
        run: test "$(uname -m)" = "aarch64"
      - name: Build frontend image
        env:
          IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
        run: docker build --pull -t "tce-frontend:$IMAGE_TAG" -f Dockerfile .
      - name: Verify image architecture
        env:
          IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
        run: test "$(docker image inspect "tce-frontend:$IMAGE_TAG" --format '{{.Architecture}}')" = "arm64"
      - name: Export frontend image
        env:
          IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
        run: docker save "tce-frontend:$IMAGE_TAG" | gzip > /tmp/tce-frontend.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tce-frontend-image
          path: /tmp/tce-frontend.tar.gz
          retention-days: 1

  build-backend:
    name: Build backend (native ARM64)
    needs: detect
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify native architecture
        run: test "$(uname -m)" = "aarch64"
      - name: Validate backend
        run: |
          set -euo pipefail
          test -f apps/service/Dockerfile
          test -f tsconfig.base.json
          test -f nx.json
          test -d apps/service
          test -d libs
          test -d packages
      - name: Build backend image
        env:
          IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
        run: docker build --pull -t "tce-service:$IMAGE_TAG" -f apps/service/Dockerfile .
      - name: Verify image architecture
        env:
          IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
        run: test "$(docker image inspect "tce-service:$IMAGE_TAG" --format '{{.Architecture}}')" = "arm64"
      - name: Export backend image
        env:
          IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
        run: docker save "tce-service:$IMAGE_TAG" | gzip > /tmp/tce-service.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tce-service-image
          path: /tmp/tce-service.tar.gz
          retention-days: 1

  deploy-production:
    name: Deploy production
    needs: [detect, build-frontend, build-backend]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      HOST: 132.226.175.206
      USERNAME: ubuntu
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify native architecture
        run: test "$(uname -m)" = "aarch64"
      - name: Validate production configuration
        run: |
          set -euo pipefail
          test -f infra/k3s/frontend-prod.yaml
          test -f infra/k3s/service-prod.yaml
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY JWT_SECRET MFA_ENCRYPTION_KEY VPS_SSH_PRIVATE_KEY; do
            value="${!name:-}"
            test -n "$value" || { echo "Missing GitHub secret: $name"; exit 1; }
          done
      - uses: actions/download-artifact@v4
        with:
          name: tce-frontend-image
          path: /tmp/images
      - uses: actions/download-artifact@v4
        with:
          name: tce-service-image
          path: /tmp/images
      - name: Render immutable production manifests
        run: |
          set -euo pipefail
          sed "s#tce-frontend:prod#docker.io/library/tce-frontend:$IMAGE_TAG#g" infra/k3s/frontend-prod.yaml > /tmp/frontend-prod.yaml
          sed "s#tce-service:prod#docker.io/library/tce-service:$IMAGE_TAG#g" infra/k3s/service-prod.yaml > /tmp/service-prod.yaml
      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key
          ssh-keygen -y -f ~/.ssh/tce_vps_key >/dev/null
      - name: Verify VPS access
        run: ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$USERNAME@$HOST" 'sudo kubectl get nodes'
      - name: Upload production bundle
        run: |
          set -euo pipefail
          scp -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
            /tmp/images/tce-frontend.tar.gz /tmp/images/tce-service.tar.gz \
            /tmp/frontend-prod.yaml /tmp/service-prod.yaml \
            "$USERNAME@$HOST:/tmp/"
      - name: Deploy production to k3s
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$USERNAME@$HOST" \
            "SUPABASE_URL='$SUPABASE_URL' SUPABASE_KEY='$SUPABASE_SERVICE_ROLE_KEY' JWT_SECRET='$JWT_SECRET' MFA_KEY='$MFA_ENCRYPTION_KEY' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          NS=tce-prod
          sudo kubectl get namespace "$NS" >/dev/null 2>&1 || sudo kubectl create namespace "$NS"
          sudo k3s ctr images import /tmp/tce-frontend.tar.gz
          sudo k3s ctr images import /tmp/tce-service.tar.gz

          verify_image() {
            local image="$1"
            echo "Checking k3s image: $image"
            if ! sudo k3s ctr images inspect "$image" >/dev/null 2>&1; then
              echo "ERROR: image not found after import: $image"
              echo "=== IMPORTED TCE IMAGES ==="
              sudo k3s ctr images list | grep 'tce-' || true
              exit 1
            fi
          }

          diagnostics() {
            local deployment="$1"
            echo "=== DIAGNOSTICS: $deployment ==="
            sudo kubectl -n "$NS" get deployment "$deployment" -o wide || true
            sudo kubectl -n "$NS" get pods -o wide || true
            sudo kubectl -n "$NS" describe deployment "$deployment" || true
            sudo kubectl -n "$NS" get pods -l "app=$deployment" -o name | while read -r pod; do
              echo "=== POD: $pod ==="
              sudo kubectl -n "$NS" describe "$pod" || true
              sudo kubectl -n "$NS" logs "$pod" --all-containers=true --tail=200 || true
              sudo kubectl -n "$NS" logs "$pod" --all-containers=true --previous --tail=200 || true
            done
            echo "=== EVENTS ==="
            sudo kubectl -n "$NS" get events --sort-by='.lastTimestamp' | tail -100 || true
          }

          deploy_and_wait() {
            local manifest="$1"
            local deployment="$2"
            local image="$3"
            verify_image "$image"
            sudo kubectl apply -f "$manifest"
            if ! sudo kubectl -n "$NS" rollout status "deployment/$deployment" --timeout=180s; then
              diagnostics "$deployment"
              exit 1
            fi
          }

          sudo kubectl -n "$NS" create secret generic tce-app-secrets \
            --from-literal=SUPABASE_URL="$SUPABASE_URL" \
            --from-literal=SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_KEY" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --dry-run=client -o yaml | sudo kubectl apply -f -

          CREDENTIAL_KEY="$(sudo kubectl -n "$NS" get secret tce-auth -o jsonpath='{.data.TCE_CREDENTIAL_ENCRYPTION_KEY}' 2>/dev/null | base64 -d || true)"
          if [ -z "$CREDENTIAL_KEY" ]; then
            CREDENTIAL_KEY="$(openssl rand -hex 32)"
            echo "Generated persistent TCE credential encryption key for production."
          else
            echo "Reusing existing TCE credential encryption key."
          fi

          sudo kubectl -n "$NS" create secret generic tce-auth \
            --from-literal=MFA_ENCRYPTION_KEY="$MFA_KEY" \
            --from-literal=TCE_CREDENTIAL_ENCRYPTION_KEY="$CREDENTIAL_KEY" \
            --dry-run=client -o yaml | sudo kubectl apply -f -

          deploy_and_wait /tmp/service-prod.yaml tce-service "docker.io/library/tce-service:$IMAGE_TAG"
          deploy_and_wait /tmp/frontend-prod.yaml tce-frontend "docker.io/library/tce-frontend:$IMAGE_TAG"

          sudo kubectl -n "$NS" get pods,svc,ingress
          sudo kubectl -n "$NS" get certificate,secret 2>/dev/null || true
          rm -f /tmp/tce-frontend.tar.gz /tmp/tce-service.tar.gz /tmp/service-prod.yaml /tmp/frontend-prod.yaml
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -rf ~/.ssh/tce_vps_key /tmp/images /tmp/*.yaml
