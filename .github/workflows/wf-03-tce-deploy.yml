name: 'WF-03 TCE Production Deploy'

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_PLATFORM: linux/arm64

jobs:
  notify-telegram-start:
    name: Notify Telegram — release started
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
    steps:
      - name: Validate Telegram configuration
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing GitHub variable: TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing GitHub variable: TELEGRAM_CHAT_ID"; exit 1; }
      - name: Send deployment started message
        run: |
          set -euo pipefail
          MESSAGE="$(printf '%s\n%s\n%s' \
            "🚀 TCE — production release started" \
            "🌿 ${{ github.ref_name }}" \
            "#642")"

          curl --fail-with-body -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

  detect:
    name: Resolve production image tag
    needs: notify-telegram-start
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="prod-v${VERSION}-${SHA}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "$IMAGE_TAG" > /tmp/image-tag.txt
          echo "Image tag: $IMAGE_TAG"
      - name: Upload immutable release metadata
        uses: actions/upload-artifact@v4
        with:
          name: tce-release-metadata
          path: /tmp/image-tag.txt
          retention-days: 1

  build-frontend:
    name: Build frontend (native ARM64)
    needs: detect
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify native architecture
        run: test "$(uname -m)" = "aarch64"
      - name: Build frontend image
        env:
          IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
        run: docker build --pull -t "tce-frontend:$IMAGE_TAG" -f Dockerfile .
      - name: Verify image architecture
        env:
          IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
        run: test "$(docker image inspect "tce-frontend:$IMAGE_TAG" --format '{{.Architecture}}')" = "arm64"
      - name: Export and validate frontend image
        env:
          IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
        run: |
          set -euo pipefail
          rm -f /tmp/tce-frontend.tar /tmp/tce-frontend.sha256
          docker save "tce-frontend:$IMAGE_TAG" -o /tmp/tce-frontend.tar
          test -s /tmp/tce-frontend.tar
          (cd /tmp && sha256sum tce-frontend.tar > tce-frontend.sha256)
          (cd /tmp && sha256sum -c tce-frontend.sha256)
          tar -tf /tmp/tce-frontend.tar >/dev/null
          ls -lh /tmp/tce-frontend.tar /tmp/tce-frontend.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: tce-frontend-image
          path: |
            /tmp/tce-frontend.tar
            /tmp/tce-frontend.sha256
          retention-days: 1

  build-backend:
    name: Build backend (native ARM64)
    needs: detect
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify native architecture
        run: test "$(uname -m)" = "aarch64"
      - name: Validate backend
        run: |
          set -euo pipefail
          test -f apps/service/Dockerfile
          test -f tsconfig.base.json
          test -f nx.json
          test -d apps/service
          test -d libs
          test -d packages
      - name: Build backend image
        env:
          IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
        run: docker build --pull -t "tce-service:$IMAGE_TAG" -f apps/service/Dockerfile .
      - name: Verify image architecture
        env:
          IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
        run: test "$(docker image inspect "tce-service:$IMAGE_TAG" --format '{{.Architecture}}')" = "arm64"
      - name: Export and validate backend image
        env:
          IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
        run: |
          set -euo pipefail
          rm -f /tmp/tce-service.tar /tmp/tce-service.sha256
          docker save "tce-service:$IMAGE_TAG" -o /tmp/tce-service.tar
          test -s /tmp/tce-service.tar
          (cd /tmp && sha256sum tce-service.tar > tce-service.sha256)
          (cd /tmp && sha256sum -c tce-service.sha256)
          tar -tf /tmp/tce-service.tar >/dev/null
          ls -lh /tmp/tce-service.tar /tmp/tce-service.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: tce-service-image
          path: |
            /tmp/tce-service.tar
            /tmp/tce-service.sha256
          retention-days: 1

  # Production deployment is owned by platform-infra GitOps.
  # WF-03 builds and validates immutable release artifacts only; the downstream
  # wf-platform-infra-release workflow publishes them to GHCR and promotes the
  # exact release into platform-infra.
  notify-telegram:
    name: Notify Telegram — release ready
    needs: [detect, build-frontend, build-backend]
    if: ${{ always() && needs.detect.result == 'success' && needs.build-frontend.result == 'success' && needs.build-backend.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
    steps:
      - name: Validate Telegram configuration
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing GitHub variable: TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing GitHub variable: TELEGRAM_CHAT_ID"; exit 1; }
      - name: Send deployment success message
        run: |
          set -euo pipefail
          MESSAGE="🚀 *TCE — WF-03 RELEASE READY*\n\n          📦 Environment: production\n          🌿 Branch: ${{ github.ref_name }}\n          🔖 Commit: ${{ github.sha }}\n          👤 Actor: ${{ github.actor }}\n          🕐 Time: $(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M:%S ICT')\n\n          ✅ Immutable production artifacts built successfully\n          🔄 Production deployment is handled by platform-infra GitOps\n          🔗 Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl --fail-with-body -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            -d "parse_mode=Markdown"
