name: WF-01P TCE Web Pull Request Build

on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nx.json'
      - 'tsconfig.base.json'
      - '.github/workflows/wf-01p-tce-web-pr-build.yml'
      - '.github/workflows/wf-03-tce-production-deploy.yml'
      - '.github/workflows/wf-09-tce-vps-safe-setup.yml'
      - 'scripts/validate-tce-release-contract.sh'
      - 'scripts/tests/verify-tce-dispatch-payload.test.sh'
      - 'scripts/verify-tce-release-source-context.sh'
      - 'scripts/tests/verify-tce-release-source-context.test.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tce-web-pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build Next.js frontend without production secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate TCE production release contract
        run: bash scripts/validate-tce-release-contract.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build:web
