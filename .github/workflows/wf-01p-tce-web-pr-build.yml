name: WF-01P TCE Web Pull Request Build

on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nx.json'
      - 'tsconfig.base.json'
      - '.github/workflows/wf-01p-tce-web-pr-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tce-web-pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build Next.js frontend without production secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build:web
