name: Apply Service ESM Runtime Fix

on:
  push:
    branches:
      - fix/service-esm-runtime

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch service ESM configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('apps/service/tsconfig.json')
          data = json.loads(p.read_text())
          opts = data.setdefault('compilerOptions', {})
          opts['module'] = 'NodeNext'
          opts['moduleResolution'] = 'NodeNext'
          p.write_text(json.dumps(data, separators=(',', ':')) + '\n')

          p = Path('apps/service/project.json')
          data = json.loads(p.read_text())
          data['targets']['build']['options']['command'] = './node_modules/.bin/tsc -p apps/service/tsconfig.json && node apps/service/scripts/fix-esm-extensions.mjs dist/apps/service'
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY

          mkdir -p apps/service/scripts
          cat > apps/service/scripts/fix-esm-extensions.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = path.resolve(process.argv[2] ?? 'dist/apps/service');
          const jsFiles = [];

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && full.endsWith('.js')) jsFiles.push(full);
            }
          }

          walk(root);

          const specifier = /((?:from\\s+|import\\s*\\(\\s*|export\\s+[^;]*?from\\s+)["'])(\\.{1,2}\\/[^"']+)(["'])/g;

          for (const file of jsFiles) {
            let source = fs.readFileSync(file, 'utf8');
            source = source.replace(specifier, (match, prefix, value, quote) => {
              if (path.extname(value)) return match;
              const candidate = path.resolve(path.dirname(file), value);
              if (fs.existsSync(candidate + '.js')) return `${prefix}${value}.js${quote}`;
              if (fs.existsSync(path.join(candidate, 'index.js'))) return `${prefix}${value}/index.js${quote}`;
              return match;
            });
            fs.writeFileSync(file, source);
          }
          JS

          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/service/Dockerfile')
          s = p.read_text()
          s = s.replace('RUN ./node_modules/.bin/nx build service\nRUN npm prune --omit=dev', 'RUN ./node_modules/.bin/nx build service\nRUN test -f /app/dist/apps/service/src/main.js\nRUN test -f /app/dist/apps/service/src/app.module.js\nRUN node --check /app/dist/apps/service/src/main.js\nRUN npm prune --omit=dev')
          s = s.replace('http://127.0.0.1:8210/auth/status', 'http://127.0.0.1:8210/api/health')
          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/service/tsconfig.json apps/service/project.json apps/service/scripts/fix-esm-extensions.mjs apps/service/Dockerfile
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix(service): resolve ESM runtime imports'
          git push
