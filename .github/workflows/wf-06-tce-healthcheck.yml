name: 'WF-06 TCE Healthcheck'

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key
      - name: Check TCE containers and local endpoints
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@132.226.175.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== TCE HEALTH ==="
          docker ps --filter name=tce- --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          for port in 3210 3211 3212; do
            if curl -fsS --max-time 5 "http://127.0.0.1:${port}/" >/dev/null 2>&1; then
              echo "PORT ${port}: OK"
            else
              echo "PORT ${port}: NOT_ACTIVE"
            fi
          done
          echo "=== EXISTING SERVICES ==="
          docker ps --format '{{.Names}}\t{{.Status}}' | grep -E 'docker-web-1|docker-api-1|mrcute|stock-|nginx' || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/tce_vps_key
