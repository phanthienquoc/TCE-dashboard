name: 'WF-06 TCE Healthcheck'

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  public-smoke:
    name: Verify public MVP HTTP endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check TCE and central Auth endpoints
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          check_endpoint() {
            local name="$1"
            local url="$2"
            local expected="$3"
            local body
            local status
            body="$(mktemp)"
            if status="$(curl --location --silent --show-error --retry 2 --retry-all-errors --connect-timeout 5 --max-time 15 --output "$body" --write-out '%{http_code}' "$url")"; then
              if [[ "$status" == "$expected" ]]; then
                echo "PASS $name: HTTP $status"
              else
                echo "::error::$name returned HTTP $status; expected $expected"
                failed=1
              fi
            else
              echo "::error::$name could not be reached: $url"
              failed=1
            fi
            rm -f "$body"
          }

          check_endpoint "TCE web" "https://tce.mrcute.space/" "200"
          check_endpoint "Auth liveness" "https://auth.mrcute.space/api/health" "200"
          check_endpoint "Auth readiness" "https://auth.mrcute.space/api/ready" "200"

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key
      - name: Check TCE containers and legacy development ports
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@132.226.175.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== TCE CONTAINERS ==="
          docker ps --filter name=tce- --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          echo "=== LEGACY/DEVELOPMENT PORTS (INFORMATIONAL; PUBLIC SMOKE JOB IS THE MVP GATE) ==="
          for port in 3210 3211 3212; do
            if curl -fsS --max-time 5 "http://127.0.0.1:${port}/" >/dev/null 2>&1; then
              echo "PORT ${port}: OK"
            else
              echo "PORT ${port}: NOT_ACTIVE (not used as the public MVP gate)"
            fi
          done
          echo "=== EXISTING SERVICES ==="
          docker ps --format '{{.Names}}\t{{.Status}}' | grep -E 'docker-web-1|docker-api-1|mrcute|stock-|nginx' || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/tce_vps_key
