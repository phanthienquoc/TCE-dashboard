name: 'WF-06 TCE Healthcheck'

'on':
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

# Application health is checked through public endpoints. Platform Infra owns
# read-only VPS/K3s runtime inspection; this app workflow must not SSH to the VPS.
permissions: {}

jobs:
  public-smoke:
    name: Public endpoint — ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: TCE web
            url: https://tce.mrcute.space/
            expected_status: "200"
          - name: TCE API
            url: https://tce.mrcute.space/api/health
            expected_status: "200"
          - name: Auth liveness
            url: https://auth.mrcute.space/api/health
            expected_status: "200"
          - name: Auth readiness
            url: https://auth.mrcute.space/api/ready
            expected_status: "200"
    steps:
      - name: Check ${{ matrix.name }}
        shell: bash
        env:
          ENDPOINT_NAME: ${{ matrix.name }}
          URL: ${{ matrix.url }}
          EXPECTED_STATUS: ${{ matrix.expected_status }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          if ! status="$(curl --location --silent --show-error --retry 2 --retry-all-errors --connect-timeout 5 --max-time 15 --output "$body" --write-out '%{http_code}' "$URL")"; then
            echo "::error::$ENDPOINT_NAME could not be reached: $URL"
            exit 1
          fi
          if [[ "$status" != "$EXPECTED_STATUS" ]]; then
            echo "::error::$ENDPOINT_NAME returned HTTP $status; expected $EXPECTED_STATUS"
            exit 1
          fi
          echo "PASS $ENDPOINT_NAME: HTTP $status"
