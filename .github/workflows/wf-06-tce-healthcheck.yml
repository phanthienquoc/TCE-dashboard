name: 'WF-06 TCE Healthcheck'

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  public-smoke:
    name: Public endpoint — ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: TCE web
            url: https://tce.mrcute.space/
            expected_status: "200"
          - name: TCE API
            url: https://tce.mrcute.space/api/health
            expected_status: "200"
          - name: Auth liveness
            url: https://auth.mrcute.space/api/health
            expected_status: "200"
          - name: Auth readiness
            url: https://auth.mrcute.space/api/ready
            expected_status: "200"
    steps:
      - name: Check ${{ matrix.name }}
        shell: bash
        env:
          ENDPOINT_NAME: ${{ matrix.name }}
          URL: ${{ matrix.url }}
          EXPECTED_STATUS: ${{ matrix.expected_status }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          if ! status="$(curl --location --silent --show-error --retry 2 --retry-all-errors --connect-timeout 5 --max-time 15 --output "$body" --write-out '%{http_code}' "$URL")"; then
            echo "::error::$ENDPOINT_NAME could not be reached: $URL"
            exit 1
          fi
          if [[ "$status" != "$EXPECTED_STATUS" ]]; then
            echo "::error::$ENDPOINT_NAME returned HTTP $status; expected $EXPECTED_STATUS"
            exit 1
          fi
          echo "PASS $ENDPOINT_NAME: HTTP $status"

  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key
      - name: Check TCE containers and legacy development ports
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@132.226.175.206 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== TCE CONTAINERS ==="
          docker ps --filter name=tce- --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          echo "=== LEGACY/DEVELOPMENT PORTS (INFORMATIONAL; PUBLIC SMOKE JOB IS THE MVP GATE) ==="
          for port in 3210 3211 3212; do
            if curl -fsS --max-time 5 "http://127.0.0.1:${port}/" >/dev/null 2>&1; then
              echo "PORT ${port}: OK"
            else
              echo "PORT ${port}: NOT_ACTIVE (not used as the public MVP gate)"
            fi
          done
          echo "=== EXISTING SERVICES ==="
          docker ps --format '{{.Names}}\t{{.Status}}' | grep -E 'docker-web-1|docker-api-1|mrcute|stock-|nginx' || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/tce_vps_key
