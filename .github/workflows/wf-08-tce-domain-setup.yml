name: "WF-08 TCE Domain Setup"

on:
  workflow_dispatch:
    inputs:
      host:
        description: "VPS IP/hostname"
        required: true
        default: "132.226.175.206"
      domain:
        description: "TCE domain"
        required: true
        default: "tce.mrcute.space"
      fe_port:
        description: "TCE FE localhost port"
        required: true
        default: "3210"
      be_port:
        description: "TCE BE localhost port"
        required: true
        default: "8210"
      enable_ssl:
        description: "Request Certbot certificate after HTTP validation"
        required: true
        default: "false"

jobs:
  domain-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key
          ssh-keygen -y -f ~/.ssh/tce_vps_key >/dev/null

      - name: Configure TCE virtual host using existing Nginx
        env:
          H: ${{ inputs.host }}
          D: ${{ inputs.domain }}
          FE: ${{ inputs.fe_port }}
          BE: ${{ inputs.be_port }}
          SSL: ${{ inputs.enable_ssl }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@"$H" "D=$D FE=$FE BE=$BE SSL=$SSL bash -s" <<'REMOTE'
          set -euo pipefail
          CFG="/etc/nginx/sites-available/${D}"
          LINK="/etc/nginx/sites-enabled/${D}"
          TMP="/tmp/tce-nginx.conf"

          # Never touch the existing mrcute.space vhost or other subdomains.
          sudo tee "$TMP" >/dev/null <<EOF
          server {
              listen 80;
              listen [::]:80;
              server_name ${D};

              location /api/ {
                  proxy_pass http://127.0.0.1:${BE}/;
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }

              location / {
                  proxy_pass http://127.0.0.1:${FE};
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          EOF

          sudo nginx -t
          sudo install -m 0644 "$TMP" "$CFG"
          sudo ln -sfn "$CFG" "$LINK"
          sudo nginx -t
          sudo systemctl reload nginx

          # Confirm that the upstreams are reachable before attempting TLS.
          curl -fsS --max-time 5 "http://127.0.0.1:${FE}/" >/dev/null
          curl -fsS --max-time 5 "http://127.0.0.1:${BE}/health" >/dev/null || true

          if [ "$SSL" = "true" ]; then
            command -v certbot >/dev/null || { echo "certbot is not installed"; exit 1; }
            sudo certbot --nginx --non-interactive --agree-tos --redirect -d "${D}"
            sudo nginx -t
            sudo systemctl reload nginx
          fi

          echo "WF-08 COMPLETE: ${D} -> FE:${FE}, API:${BE}"
          echo "Existing Nginx vhosts were not edited."
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/tce_vps_key
