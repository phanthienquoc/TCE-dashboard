name: "WF-08 TCE Domain Setup"

on:
  workflow_dispatch:
    inputs:
      host:
        description: "VPS IP/hostname"
        required: true
        default: "132.226.175.206"
      domain:
        description: "TCE domain"
        required: true
        default: "tce.mrcute.space"
      deploy_env:
        description: "Environment"
        required: true
        type: choice
        options:
          - stg
          - prod
        default: stg
      enable_ssl:
        description: "Request Certbot certificate after ACME preflight"
        required: true
        default: "true"
      dry_run:
        description: "Validate only; do not modify Nginx"
        required: true
        default: "false"

jobs:
  domain-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key
          ssh-keygen -y -f ~/.ssh/tce_vps_key >/dev/null

      - name: Configure TCE HTTP and HTTPS safely
        env:
          H: ${{ inputs.host }}
          D: ${{ inputs.domain }}
          ENV: ${{ inputs.deploy_env }}
          SSL: ${{ inputs.enable_ssl }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$ENV" = "stg" ]; then FE=3210; BE=8210; else FE=3212; BE=8212; fi
          export FE BE
          echo "Environment : $ENV"
          echo "Domain      : $D"
          echo "Frontend    : 127.0.0.1:$FE"
          echo "Backend     : 127.0.0.1:$BE"
          echo "SSL         : $SSL"
          echo "Dry run     : $DRY_RUN"

          ssh -i ~/.ssh/tce_vps_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            ubuntu@"$H" "D='$D' ENV='$ENV' FE='$FE' BE='$BE' SSL='$SSL' DRY_RUN='$DRY_RUN' bash -s" <<'REMOTE'
          set -euo pipefail

          CFG="/etc/nginx/sites-available/${D}"
          LINK="/etc/nginx/sites-enabled/${D}"
          TMP="/tmp/tce-domain-${ENV}.conf"
          ACME_ROOT="/var/www/tce-acme"
          BACKUP_DIR="/var/backups/tce-nginx"
          TS="$(date +%Y%m%d-%H%M%S)"
          BACKUP="${BACKUP_DIR}/${ENV}-${D}-${TS}.conf"

          echo "=== SAFETY PRECHECK ==="
          sudo nginx -t
          sudo systemctl is-active --quiet nginx
          getent hosts "$D"
          curl -sS -I --max-time 10 "http://${D}/" || true

          sudo mkdir -p "${ACME_ROOT}/.well-known/acme-challenge" "$BACKUP_DIR"
          sudo chown -R www-data:www-data "$ACME_ROOT"

          # Refuse to proceed if another enabled vhost claims the exact same hostname.
          DUPES="$(sudo nginx -T 2>&1 | awk -v d="$D" '$1 == "server_name" {for (i=2;i<=NF;i++){gsub(";","",$i); if($i==d) print FILENAME ":" $0}}' | wc -l)"
          echo "Exact server_name occurrences before change: $DUPES"

          if [ -f "$CFG" ]; then
            sudo cp -a "$CFG" "$BACKUP"
            echo "Backup: $BACKUP"
          else
            echo "MISSING" | sudo tee "$BACKUP" >/dev/null
            echo "Backup marker: $BACKUP"
          fi

          cat > "$TMP" <<EOF
          server {
              listen 80;
              listen [::]:80;
              server_name ${D};

              location ^~ /.well-known/acme-challenge/ {
                  root ${ACME_ROOT};
                  default_type text/plain;
                  try_files \$uri =404;
              }

              location /api/ {
                  proxy_pass http://127.0.0.1:${BE}/;
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }

              location / {
                  proxy_pass http://127.0.0.1:${FE};
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          EOF

          echo "=== GENERATED HTTP CONFIG ==="
          cat "$TMP"

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN: no Nginx files modified and no reload performed."
            exit 0
          fi

          sudo install -m 0644 "$TMP" "$CFG"
          sudo ln -sfn "$CFG" "$LINK"
          sudo nginx -t
          sudo systemctl reload nginx
          sudo systemctl is-active --quiet nginx

          echo "=== LOCAL ACME PREFLIGHT ==="
          CHECK="tce-acme-${TS}"
          echo "${CHECK}" | sudo tee "${ACME_ROOT}/.well-known/acme-challenge/${CHECK}" >/dev/null
          trap 'sudo rm -f "${ACME_ROOT}/.well-known/acme-challenge/${CHECK}"' EXIT

          BODY="$(curl -fsS --max-time 10 "http://${D}/.well-known/acme-challenge/${CHECK}")"
          test "$BODY" = "$CHECK" || {
            echo "ACME preflight FAILED: expected '$CHECK', got '$BODY'"
            echo "=== ACTIVE MATCHING SERVER NAMES ==="
            sudo nginx -T 2>&1 | grep -n -E "server_name[[:space:]].*${D}([;[:space:]]|$)" || true
            exit 1
          }
          echo "ACME preflight OK: public HTTP serves the exact challenge token."
          sudo rm -f "${ACME_ROOT}/.well-known/acme-challenge/${CHECK}"
          trap - EXIT

          echo "=== HTTP CHECK ==="
          curl -fsS -I --max-time 10 "http://${D}/"

          if [ "$SSL" = "true" ]; then
            command -v certbot >/dev/null || { echo "certbot is not installed"; exit 1; }

            echo "=== REQUEST LET'S ENCRYPT CERTIFICATE ==="
            sudo certbot certonly \
              --webroot -w "$ACME_ROOT" \
              --non-interactive \
              --agree-tos \
              --keep-until-expiring \
              -d "$D"

            CERT_DIR="/etc/letsencrypt/live/${D}"
            test -s "${CERT_DIR}/fullchain.pem"
            test -s "${CERT_DIR}/privkey.pem"

            cat > "$TMP" <<EOF
          server {
              listen 80;
              listen [::]:80;
              server_name ${D};

              location ^~ /.well-known/acme-challenge/ {
                  root ${ACME_ROOT};
                  default_type text/plain;
                  try_files \$uri =404;
              }

              location / {
                  return 301 https://\$host\$request_uri;
              }
          }

          server {
              listen 443 ssl;
              listen [::]:443 ssl;
              server_name ${D};

              ssl_certificate ${CERT_DIR}/fullchain.pem;
              ssl_certificate_key ${CERT_DIR}/privkey.pem;

              location /api/ {
                  proxy_pass http://127.0.0.1:${BE}/;
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
              }

              location / {
                  proxy_pass http://127.0.0.1:${FE};
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
              }
          }
          EOF

            sudo install -m 0644 "$TMP" "$CFG"
            sudo nginx -t
            sudo systemctl reload nginx
            sudo systemctl is-active --quiet nginx

            echo "=== HTTPS CHECK ==="
            curl -fsS -I --max-time 15 "https://${D}/"
          fi

          echo "=== TCE DOMAIN SETUP COMPLETE ==="
          echo "${D} -> FE:${FE} BE:${BE}"
          echo "Rollback backup: ${BACKUP}"
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/tce_vps_key
