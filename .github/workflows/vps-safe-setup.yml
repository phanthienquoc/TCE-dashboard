name: TCE VPS Safe Setup

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'VPS IP/hostname'
        required: true
        default: '132.226.175.206'
      port:
        description: 'SSH port'
        required: true
        default: '22'
      username:
        description: 'SSH username'
        required: true
        default: 'ubuntu'

jobs:
  safe-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout TCE
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key
          ssh-keygen -y -f ~/.ssh/tce_vps_key >/tmp/tce_vps_public_key

      - name: Inspect VPS without changing existing services
        env:
          HOST: ${{ inputs.host }}
          PORT: ${{ inputs.port }}
          USERNAME: ${{ inputs.username }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/tce_vps_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            -p "$PORT" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== TCE SAFE VPS SETUP ==="
          echo "Host: $(hostname)"
          echo "User: $(whoami)"
          echo "=== Disk ==="
          df -h /
          echo "=== Memory ==="
          free -h
          echo "=== Docker ==="
          if command -v docker >/dev/null 2>&1; then
            docker --version
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          else
            echo "Docker: NOT INSTALLED"
          fi
          echo "=== Existing app directory ==="
          if [ -d /home/ubuntu/app ]; then
            ls -la /home/ubuntu/app | head -80
          else
            echo "/home/ubuntu/app does not exist"
          fi
          echo "=== Nginx ==="
          if command -v nginx >/dev/null 2>&1; then
            nginx -v
            systemctl is-active nginx || true
          else
            echo "Nginx: NOT INSTALLED"
          fi
          echo "=== Existing listeners ==="
          if command -v ss >/dev/null 2>&1; then
            ss -lntp | head -80
          fi
          echo "=== Creating isolated TCE directories only ==="
          install -d -m 0755 /home/ubuntu/tce
          install -d -m 0755 /home/ubuntu/tce/development
          install -d -m 0755 /home/ubuntu/tce/staging
          install -d -m 0755 /home/ubuntu/tce/production
          echo "TCE directories ready."
          echo "IMPORTANT: existing Docker containers, nginx, ports and mrcute.space were NOT modified."
          REMOTE

      - name: Upload TCE source to isolated staging directory
        env:
          HOST: ${{ inputs.host }}
          PORT: ${{ inputs.port }}
          USERNAME: ${{ inputs.username }}
        run: |
          set -euo pipefail
          tar --exclude='.git' --exclude='.github' -czf /tmp/tce-source.tar.gz .
          scp -i ~/.ssh/tce_vps_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            -P "$PORT" /tmp/tce-source.tar.gz "$USERNAME@$HOST:/tmp/tce-source.tar.gz"
          ssh -i ~/.ssh/tce_vps_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -p "$PORT" "$USERNAME@$HOST" \
            'set -e; rm -rf /home/ubuntu/tce/development/source.tmp; mkdir -p /home/ubuntu/tce/development/source.tmp; tar -xzf /tmp/tce-source.tar.gz -C /home/ubuntu/tce/development/source.tmp; rm -f /tmp/tce-source.tar.gz; echo "TCE source uploaded to isolated development path."'

      - name: Cleanup runner key
        if: always()
        run: rm -f ~/.ssh/tce_vps_key /tmp/tce_vps_public_key /tmp/tce-source.tar.gz
