name: "WF-12 TCE Nginx Revert"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "TCE environment to revert"
        required: true
        type: choice
        options:
          - stg
          - prod
        default: stg
      restore_previous:
        description: "Restore the Nginx config backup created by WF-11"
        required: true
        type: boolean
        default: true
      remove_certificate:
        description: "Remove only the TCE certificate lineage if it was created by WF-11"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  VPS_HOST: 132.226.175.206
  VPS_USER: ubuntu

jobs:
  revert:
    name: Safely revert TCE Nginx changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key
          ssh-keygen -y -f ~/.ssh/tce_vps_key >/dev/null

      - name: Revert Nginx safely
        env:
          H: ${{ env.VPS_HOST }}
          U: ${{ env.VPS_USER }}
          ENV_NAME: ${{ inputs.environment }}
          RESTORE_PREVIOUS: ${{ inputs.restore_previous }}
          REMOVE_CERTIFICATE: ${{ inputs.remove_certificate }}
        run: |
          set -euo pipefail

          if [ "$ENV_NAME" = "stg" ]; then
            DOMAIN="tce-stg.mrcute.space"
          else
            DOMAIN="tce.mrcute.space"
          fi

          ssh -i ~/.ssh/tce_vps_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            "$U@$H" "DOMAIN='$DOMAIN' ENV_NAME='$ENV_NAME' RESTORE_PREVIOUS='$RESTORE_PREVIOUS' REMOVE_CERTIFICATE='$REMOVE_CERTIFICATE' bash -s" <<'REMOTE'
          set -euo pipefail

          CFG="/etc/nginx/sites-available/${DOMAIN}"
          LINK="/etc/nginx/sites-enabled/${DOMAIN}"
          BACKUP_DIR="/var/backups/tce-nginx"
          BACKUP_PREFIX="${BACKUP_DIR}/${ENV_NAME}-${DOMAIN}"

          echo "=== CURRENT STATE ==="
          sudo nginx -t
          sudo nginx -T 2>&1 | grep -E "server_name ${DOMAIN}|ssl_certificate|proxy_pass" || true

          echo "=== AVAILABLE BACKUPS ==="
          sudo ls -lah "$BACKUP_DIR" 2>/dev/null || true

          if [ "$RESTORE_PREVIOUS" = "true" ]; then
            BACKUP="$(sudo ls -1t "${BACKUP_PREFIX}"*.conf 2>/dev/null | head -1 || true)"
            if [ -n "$BACKUP" ]; then
              echo "Restoring: $BACKUP"
              sudo install -m 0644 "$BACKUP" "$CFG"
              sudo ln -sfn "$CFG" "$LINK"
            else
              echo "No WF-11 backup found. Nothing will be deleted."
            fi
          else
            echo "restore_previous=false: leaving current site config untouched"
          fi

          # Never remove the whole Nginx installation, other sites, or other certificates.
          # The optional certificate deletion is restricted to this exact TCE lineage.
          if [ "$REMOVE_CERTIFICATE" = "true" ]; then
            if command -v certbot >/dev/null 2>&1 && sudo certbot certificates 2>/dev/null | grep -Fq "Certificate Name: ${DOMAIN}"; then
              echo "Deleting only certificate lineage: ${DOMAIN}"
              sudo certbot delete --cert-name "$DOMAIN" --non-interactive || true
            else
              echo "No certificate lineage named ${DOMAIN}; skipping certificate deletion."
            fi
          fi

          echo "=== SAFETY CHECK ==="
          sudo nginx -t
          sudo systemctl reload nginx
          sudo systemctl is-active --quiet nginx

          echo "=== POST-REVERT CHECK ==="
          curl -sS -I --max-time 10 "http://${DOMAIN}/" || true
          curl -k -sS -I --max-time 10 "https://${DOMAIN}/" || true
          sudo systemctl is-active --quiet nginx

          echo "=== REVERT COMPLETE ==="
          echo "Nginx remains installed and active. Other sites/configs were not removed."
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/tce_vps_key
