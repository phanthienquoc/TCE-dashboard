name: VPS SSH Connectivity Test

on:
  workflow_dispatch:
    inputs:
      host:
        description: "VPS hostname/IP"
        required: true
        default: "140.238.3.233"
      port:
        description: "SSH port"
        required: true
        default: "22"
      username:
        description: "SSH username"
        required: true
        default: "ubuntu"

jobs:
  test-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key

      - name: Validate private key
        run: |
          set -euo pipefail
          if [ ! -s ~/.ssh/tce_vps_key ]; then
            echo "ERROR: VPS_SSH_PRIVATE_KEY is empty or unavailable."
            exit 1
          fi

          if ssh-keygen -y -f ~/.ssh/tce_vps_key > /tmp/tce_vps_public_key 2>/tmp/tce_key_error; then
            echo "Private key format: OK"
            ssh-keygen -lf /tmp/tce_vps_public_key
          else
            echo "ERROR: GitHub Secret VPS_SSH_PRIVATE_KEY is not a valid private SSH key."
            echo "ssh-keygen diagnostic:"
            cat /tmp/tce_key_error
            exit 1
          fi

      - name: Test TCP port
        env:
          HOST: ${{ inputs.host }}
          PORT: ${{ inputs.port }}
        run: |
          echo "Testing $HOST:$PORT"
          timeout 10 bash -c "</dev/tcp/$HOST/$PORT" \
            && echo "TCP port is reachable" \
            || { echo "TCP port is NOT reachable"; exit 1; }

      - name: Test SSH authentication
        env:
          HOST: ${{ inputs.host }}
          PORT: ${{ inputs.port }}
          USERNAME: ${{ inputs.username }}
        run: |
          ssh -i ~/.ssh/tce_vps_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            -p "$PORT" \
            "$USERNAME@$HOST" \
            'echo "SSH_CONNECTED"; hostname; whoami; uptime'

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/tce_vps_key /tmp/tce_vps_public_key /tmp/tce_key_error
