name: WF-13 TCE Healthcheck Schedule Recovery
run-name: >-
  WF-13 TCE Healthcheck Schedule Recovery / source
  ${{ github.event.workflow_run.id || 'none' }}

'on':
  workflow_run:
    workflows:
      - WF-06 TCE Healthcheck
      - WF-12 TCE Healthcheck Schedule Watchdog
    types:
      - completed

permissions:
  actions: write
  contents: read

concurrency:
  group: tce-wf06-schedule-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Dispatch read-only WF-06 fallback for a verified stale schedule
    if: >-
      ${{ github.run_attempt == 1 &&
          github.event.workflow_run.run_attempt == 1 &&
          github.event.workflow_run.head_branch == 'master' &&
          github.event.workflow_run.conclusion == 'failure' &&
          ((github.event.workflow_run.event == 'schedule' &&
            (github.event.workflow_run.workflow_id == 339198323 ||
             github.event.workflow_run.workflow_id == 403352324)) ||
           (github.event.workflow_run.event == 'workflow_run' &&
            github.event.workflow_run.workflow_id == 403352324)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      MAX_AGE_MINUTES: "25"
    steps:
      # Planned zero-replica maintenance suppresses only redundant fallback probes.
      # WF-06 HTTP 200 health checks and WF-12 native schedule monitoring stay strict.
      - id: maintenance
        name: Honor explicit TCE maintenance mode
        shell: bash
        env:
          TCE_MAINTENANCE_MODE: ${{ vars.TCE_MAINTENANCE_MODE }}
        run: |
          set -euo pipefail
          case "${TCE_MAINTENANCE_MODE,,}" in
            true|1|yes)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "::notice::TCE maintenance mode is enabled; suppressing only the read-only WF-06 fallback. WF-06 HTTP 200 probes and WF-12 schedule monitoring remain strict; maintenance is not healthy."
              ;;
            ""|false|0|no)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::TCE_MAINTENANCE_MODE must be true or false; refusing ambiguous recovery behavior."
              exit 1
              ;;
          esac

      - id: source
        if: steps.maintenance.outputs.enabled != 'true'
        name: Validate native failure or stale watchdog source
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" == "1" ]]
          [[ "$SOURCE_HEAD_BRANCH" == "master" ]]
          [[ "$SOURCE_CONCLUSION" == "failure" ]]
          [[ "$SOURCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

          source_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          source_id="$(jq -r '.id // empty' <<< "$source_run")"
          source_workflow_id="$(jq -r '.workflow_id // 0' <<< "$source_run")"
          source_workflow_path_from_api="$(jq -r '.path // empty' <<< "$source_run")"
          source_event="$(jq -r '.event // empty' <<< "$source_run")"
          source_attempt="$(jq -r '.run_attempt // 0' <<< "$source_run")"
          source_branch="$(jq -r '.head_branch // empty' <<< "$source_run")"
          source_conclusion="$(jq -r '.conclusion // empty' <<< "$source_run")"
          source_sha="$(jq -r '.head_sha // empty' <<< "$source_run")"
          reference_at="$(jq -r '.created_at // empty' <<< "$source_run")"
          reference_epoch="$(jq -r 'if .created_at then (.created_at | fromdateiso8601) else empty end' <<< "$source_run")"

          [[ "$source_id" == "$SOURCE_RUN_ID" ]]
          [[ "$source_workflow_id" == "$SOURCE_WORKFLOW_ID" ]]
          [[ "$source_attempt" == "1" && "$source_branch" == "master" && "$source_conclusion" == "failure" ]]
          [[ "$source_sha" == "$SOURCE_HEAD_SHA" && -n "$reference_at" && "$reference_epoch" =~ ^[0-9]+$ ]]

          case "$SOURCE_WORKFLOW_ID" in
            339198323) source_workflow_path=".github/workflows/wf-06-tce-healthcheck.yml" ;;
            403352324) source_workflow_path=".github/workflows/wf-12-tce-healthcheck-schedule-watchdog.yml" ;;
            *) echo "::error::Unapproved WF-06/WF-12 source workflow ID."; exit 1 ;;
          esac
          [[ "$source_workflow_path" == "$source_workflow_path_from_api" ]]

          direct_wf06_failure=false
          source_mode=""
          case "$source_workflow_id:$source_event" in
            339198323:schedule)
              [[ "$source_workflow_path" == ".github/workflows/wf-06-tce-healthcheck.yml" ]]
              direct_wf06_failure=true
              source_mode="native-wf06-failure"
              ;;
            403352324:schedule)
              [[ "$source_workflow_path" == ".github/workflows/wf-12-tce-healthcheck-schedule-watchdog.yml" ]]
              source_mode="native-wf12-failure"
              ;;
            403352324:workflow_run)
              [[ "$source_workflow_path" == ".github/workflows/wf-12-tce-healthcheck-schedule-watchdog.yml" ]]
              jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100")"
              verify_job="$(jq -c '[.jobs[] | select(.name == "Verify WF-06 schedule delivery")] | if length == 1 then .[0] else empty end' <<< "$jobs")"
              [[ -n "$verify_job" ]]
              jq -e '
                .status == "completed" and
                .conclusion == "failure" and
                ([.steps[] | select(.name == "Verify WF-06 workflow is enabled" and .conclusion == "success")] | length == 1) and
                ([.steps[] | select(.name == "Inspect latest scheduled WF-06 run" and .conclusion == "failure")] | length == 1)
              ' <<< "$verify_job" >/dev/null
              source_mode="watchdog-detected-stale-wf06"
              ;;
            *)
              echo "::error::Source is not an approved native WF-06/WF-12 failure or failed stale WF-12 watchdog."
              exit 1
              ;;
          esac

          {
            echo "source_run_id=$source_id"
            echo "source_workflow_id=$source_workflow_id"
            echo "source_sha=$source_sha"
            echo "reference_at=$reference_at"
            echo "direct_wf06_failure=$direct_wf06_failure"
            echo "source_mode=$source_mode"
          } >> "$GITHUB_OUTPUT"
          echo "Verified recovery source #$source_id: workflow_id=$source_workflow_id event=$source_event mode=$source_mode sha=$source_sha."

      - name: Dispatch a deduplicated read-only WF-06 fallback
        if: steps.maintenance.outputs.enabled != 'true'
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_WORKFLOW_ID: ${{ steps.source.outputs.source_workflow_id }}
          SOURCE_HEAD_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_REFERENCE_AT: ${{ steps.source.outputs.reference_at }}
          DIRECT_WF06_FAILURE: ${{ steps.source.outputs.direct_wf06_failure }}
          SOURCE_MODE: ${{ steps.source.outputs.source_mode }}
        run: |
          set -euo pipefail

          source_run="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          source_workflow_id="$(jq -r '.workflow_id // 0' <<< "$source_run")"
          source_sha="$(jq -r '.head_sha // empty' <<< "$source_run")"
          source_created_at="$(jq -r '.created_at // empty' <<< "$source_run")"
          source_attempt="$(jq -r '.run_attempt // 0' <<< "$source_run")"
          source_branch="$(jq -r '.head_branch // empty' <<< "$source_run")"
          source_conclusion="$(jq -r '.conclusion // empty' <<< "$source_run")"
          [[ "$source_workflow_id" == "$SOURCE_WORKFLOW_ID" && "$source_sha" == "$SOURCE_HEAD_SHA" ]]
          [[ "$source_created_at" == "$SOURCE_REFERENCE_AT" ]]
          [[ "$source_attempt" == "1" && "$source_branch" == "master" && "$source_conclusion" == "failure" ]]

          reference_at="$SOURCE_REFERENCE_AT"
          reference_epoch="$(jq -nr --arg timestamp "$reference_at" '$timestamp | fromdateiso8601')"
          [[ "$reference_epoch" =~ ^[0-9]+$ ]] || {
            echo "::error::Unable to resolve the exact source-run reference clock."
            exit 1
          }

          workflow="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/wf-06-tce-healthcheck.yml")"
          state="$(jq -r '.state // empty' <<< "$workflow")"
          if [[ "$state" != "active" ]]; then
            echo "::warning::WF-06 is not active (state=${state:-missing}); fallback dispatch is skipped."
            exit 0
          fi

          native_runs="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/wf-06-tce-healthcheck.yml/runs" -f event=schedule -F per_page=100)"
          native_latest="$(jq -c '.workflow_runs | sort_by(.created_at) | last // empty' <<< "$native_runs")"
          if [[ -n "$native_latest" ]]; then
            native_id="$(jq -r '.id' <<< "$native_latest")"
            native_created="$(jq -r '.created_at' <<< "$native_latest")"
            native_epoch="$(jq -r '.created_at | fromdateiso8601' <<< "$native_latest")"
            native_conclusion="$(jq -r '.conclusion // "pending"' <<< "$native_latest")"
            if [[ "$DIRECT_WF06_FAILURE" == true ]]; then
              if [[ "$native_id" != "$SOURCE_RUN_ID" && "$native_epoch" -gt "$reference_epoch" && "$native_conclusion" == "success" ]]; then
                echo "A newer successful native WF-06 run #${native_id} supersedes failed source #${SOURCE_RUN_ID}; no fallback needed."
                exit 0
              fi
              echo "::warning::Native WF-06 source #$SOURCE_RUN_ID failed; dispatching one read-only fallback despite its fresh schedule timestamp."
            else
              native_age=$((reference_epoch - native_epoch))
              (( native_age >= 0 )) || {
                echo "::error::Native WF-06 run #${native_id} is newer than the GitHub API reference clock."
                exit 1
              }
              if (( native_age <= MAX_AGE_MINUTES * 60 )); then
                echo "Native WF-06 run #${native_id} is fresh (age=$((native_age / 60))m); no fallback dispatch."
                exit 0
              fi
              echo "::warning::Native WF-06 run #${native_id} is stale (created=${native_created}, age=$((native_age / 60))m); source_mode=$SOURCE_MODE."
            fi
          elif [[ "$DIRECT_WF06_FAILURE" == true ]]; then
            echo "::warning::Failed WF-06 source #$SOURCE_RUN_ID is not present in the latest native run page; dispatching the verified source fallback."
          else
            echo "::warning::No native scheduled WF-06 run exists; checking fallback history."
          fi

          fallback_runs="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/wf-06-tce-healthcheck.yml/runs" -f event=workflow_dispatch -F branch=master -F per_page=100)"
          fallback_latest="$(jq -c '.workflow_runs | sort_by(.created_at) | last // empty' <<< "$fallback_runs")"
          if [[ -n "$fallback_latest" ]]; then
            fallback_id="$(jq -r '.id' <<< "$fallback_latest")"
            fallback_status="$(jq -r '.status' <<< "$fallback_latest")"
            fallback_created="$(jq -r '.created_at' <<< "$fallback_latest")"
            fallback_epoch="$(jq -r '.created_at | fromdateiso8601' <<< "$fallback_latest")"
            fallback_age=$((reference_epoch - fallback_epoch))
            (( fallback_age >= 0 )) || {
              echo "::error::Fallback WF-06 run #${fallback_id} is newer than the GitHub API reference clock."
              exit 1
            }
            if [[ "$fallback_status" != "completed" ]]; then
              echo "WF-06 fallback #${fallback_id} is ${fallback_status}; avoiding duplicate dispatch."
              exit 0
            fi
            if (( fallback_age <= MAX_AGE_MINUTES * 60 )); then
              fallback_conclusion="$(jq -r '.conclusion // "unknown"' <<< "$fallback_latest")"
              echo "Recent WF-06 fallback #${fallback_id} is fresh (age=$((fallback_age / 60))m, conclusion=${fallback_conclusion}); no duplicate dispatch."
              exit 0
            fi
            echo "::notice::Latest WF-06 fallback #${fallback_id} is stale (created=${fallback_created}, age=$((fallback_age / 60))m)."
          fi

          dispatch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq .sha)"
          [[ "$dispatch_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Unable to resolve exact master SHA before WF-06 fallback dispatch."
            exit 1
          }
          echo "Dispatch payload: workflow=wf-06-tce-healthcheck.yml ref=master sha=${dispatch_sha} source_run_id=$SOURCE_RUN_ID source_mode=$SOURCE_MODE (no inputs)."
          gh workflow run wf-06-tce-healthcheck.yml --repo "$GITHUB_REPOSITORY" --ref master

          dispatched_run=""
          for attempt in $(seq 1 8); do
            response="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/wf-06-tce-healthcheck.yml/runs" -f event=workflow_dispatch -F branch=master -F per_page=100)"
            dispatched_run="$(jq -c --arg started "$reference_at" --arg sha "$dispatch_sha" '[.workflow_runs[] | select(.head_branch == "master" and .head_sha == $sha and .event == "workflow_dispatch" and .created_at >= $started)] | sort_by(.created_at) | last // empty' <<< "$response")"
            if [[ -n "$dispatched_run" ]]; then
              run_id="$(jq -r '.id' <<< "$dispatched_run")"
              run_url="$(jq -r '.html_url' <<< "$dispatched_run")"
              run_status="$(jq -r '.status' <<< "$dispatched_run")"
              echo "Verified read-only WF-06 fallback dispatch: #${run_id} status=$run_status sha=${dispatch_sha} $run_url"
              echo "This workflow_dispatch fallback does not satisfy native schedule freshness."
              exit 0
            fi
            echo "Waiting for exact-ref WF-06 fallback run correlation (attempt $attempt/8)..."
            sleep 5
          done

          echo "::error::GitHub accepted no correlatable master WF-06 workflow_dispatch run for SHA ${dispatch_sha}."
          exit 1
