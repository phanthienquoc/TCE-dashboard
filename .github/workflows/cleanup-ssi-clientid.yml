name: Cleanup SSI clientId

on:
  push:
    branches: [fix/ssi-clientid-cleanup]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete SSI clientId
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          text_files = []
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts or 'node_modules' in p.parts:
                  continue
              try:
                  p.read_text(encoding='utf-8')
              except Exception:
                  continue
              text_files.append(p)

          for p in text_files:
              s = p.read_text(encoding='utf-8')
              original = s

              # Type/config fields.
              s = re.sub(r'^\s*clientId\?: string;\n', '', s, flags=re.M)
              s = re.sub(r'^\s*clientId: string;\n', '', s, flags=re.M)
              s = re.sub(r'^\s*clientId:\s*raw\.clientId \? String\(raw\.clientId\) : undefined,\n', '', s, flags=re.M)
              s = re.sub(r'^\s*clientId:\s*this\.config\.clientId \?\? \'\',\n', '', s, flags=re.M)

              # UI credential model and JSON parsing.
              s = s.replace("type Credentials = { clientId: string; apiKey: string; apiSecret: string; privateKey: string };", "type Credentials = { apiKey: string; apiSecret: string; privateKey: string };")
              s = s.replace("const initialCredentials: Credentials = { clientId: '', apiKey: '', apiSecret: '', privateKey: '' };", "const initialCredentials: Credentials = { apiKey: '', apiSecret: '', privateKey: '' };")
              s = re.sub(r"\s*clientId: pick\(source, 'clientId', 'client_id', 'clientID'\),", '', s)
              s = re.sub(r"\s*<Field label=\"Client ID\">.*?</Field>\s*", '\n', s, flags=re.S)
              s = s.replace("Loaded ${found}/4 credential fields", "Loaded ${found}/3 credential fields")
              s = s.replace("Object.values(next).filter(Boolean).length", "Object.values(next).filter(Boolean).length")

              # Remove explicit portfolio clientId guard and its error message.
              s = re.sub(r"\s*if \(!this\.config\.clientId\?\.trim\(\)\)\n\s*throw new Error\(\n\s*'SSI_CLIENT_ID_REQUIRED_FOR_PORTFOLIO: clientId is required by SSI for equity positions'\n\s*\);\n", '\n', s)

              if s != original:
                  p.write_text(s, encoding='utf-8')

          # Remove this temporary workflow after it has applied the cleanup.
          Path('.github/workflows/cleanup-ssi-clientid.yml').unlink(missing_ok=True)
        
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix(ssi): remove obsolete clientId'
          git push