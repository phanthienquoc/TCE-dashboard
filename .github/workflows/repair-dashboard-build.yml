name: repair-dashboard-build

on:
  push:
    branches: [fix/dashboard-build]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair missing imports
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/app/dashboard/page.tsx')
          s = p.read_text()
          marker = "import PlatformConfigTab from '../../components/config/PlatformConfigTab';\n"
          imp = "import { NavigationDock } from '../../components/navigation/NavigationDock';\n"
          if imp not in s:
              s = s.replace(marker, marker + imp)
          p.write_text(s)

          p = Path('apps/web/components/navigation/NavigationDock.tsx')
          s = p.read_text()
          marker = "import type { LucideIcon } from 'lucide-react';\n"
          imp = "import { LogOut } from 'lucide-react';\n"
          if imp not in s:
              s = s.replace(marker, marker + imp)
          p.write_text(s)
          PY
      - name: Commit fixes and remove repair workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-dashboard-build.yml
          git add apps/web/app/dashboard/page.tsx apps/web/components/navigation/NavigationDock.tsx
          git commit -m "fix(web): repair dashboard navigation imports"
          git push origin HEAD:fix/dashboard-build
