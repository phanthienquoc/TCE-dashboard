name: WF-03 Actionlint Validation

on:
  pull_request:
    paths:
      - ".github/workflows/wf-03-tce-production-deploy.yml"
      - ".github/workflows/wf-03-actionlint.yml"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/wf-03-tce-production-deploy.yml"
      - ".github/workflows/wf-03-actionlint.yml"

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint WF-03 with actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          files: ".github/workflows/wf-03-tce-production-deploy.yml"
