name: WF-07 TCE 3rd-Party Integration Check

on:
  workflow_dispatch:
    inputs:
      target:
        description: 3rd-party integration target
        required: true
        default: all
        type: choice
        options: [all, binance-testnet, order-integration]
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: tce-3rd-party-integration-check
  cancel-in-progress: false

env:
  BINANCE_TESTNET_BASE_URL: https://testnet.binancefuture.com

jobs:
  binance-testnet:
    name: Binance Testnet private API
    if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'binance-testnet' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run Binance public and private checks in parallel
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BINANCE_API_KEY" || { echo 'Missing BINANCE_TESTNET_API_KEY'; exit 1; }
          test -n "$BINANCE_API_SECRET" || { echo 'Missing BINANCE_TESTNET_API_SECRET'; exit 1; }
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          public_check() {
            code="$(curl --silent --show-error --output "$workdir/public.body" --write-out '%{http_code}' --connect-timeout 10 --max-time 20 --retry 2 "$BINANCE_TESTNET_BASE_URL/fapi/v1/ping")" || { echo 'Binance Testnet public curl failed'; return 1; }
            echo "Binance Testnet public HTTP $code"; test "$code" = '200'; jq -e 'type == "object"' "$workdir/public.body" >/dev/null
          }
          private_check() {
            time_json="$(curl --silent --show-error --connect-timeout 10 --max-time 20 --retry 2 "$BINANCE_TESTNET_BASE_URL/fapi/v1/time")" || { echo 'Binance server-time curl failed'; return 1; }
            timestamp="$(printf '%s' "$time_json" | jq -er '.serverTime')"; query="timestamp=${timestamp}&recvWindow=5000"; signature="$(printf '%s' "$query" | openssl dgst -sha256 -hmac "$BINANCE_API_SECRET" | awk '{print $NF}')"; url="$BINANCE_TESTNET_BASE_URL/fapi/v2/account?${query}&signature=${signature}"
            http_code="$(curl --silent --show-error --output "$workdir/private.body" --write-out '%{http_code}' --connect-timeout 10 --max-time 30 --header "X-MBX-APIKEY: $BINANCE_API_KEY" "$url")" || { echo 'Binance Testnet private curl failed'; return 1; }
            echo "Binance Testnet private HTTP $http_code"
            if [ "$http_code" != '200' ]; then jq -c '{code, msg}' "$workdir/private.body" 2>/dev/null || cat "$workdir/private.body"; return 1; fi
            jq -e 'type == "object" and (has("code") | not)' "$workdir/private.body" >/dev/null
            echo "Binance Testnet private API: OK (canTrade=$(jq -r '.canTrade // "unknown"' "$workdir/private.body"))"
          }
          public_check >"$workdir/public.log" 2>&1 & public_pid=$!; private_check >"$workdir/private.log" 2>&1 & private_pid=$!
          public_status=0; private_status=0; wait "$public_pid" || public_status=$?; wait "$private_pid" || private_status=$?
          echo '=== PUBLIC CHECK LOG ==='; cat "$workdir/public.log"; echo '=== PRIVATE CHECK LOG ==='; cat "$workdir/private.log"; test "$public_status" -eq 0; test "$private_status" -eq 0

  order-integration:
    name: Binance Testnet order integration (3rd-party only)
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'order-integration') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BINANCE_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
      BINANCE_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
      TEST_SYMBOL: BTCUSDT
      TEST_QUANTITY: '0.002'
    steps:
      - name: Validate Binance Testnet order-test configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BINANCE_API_KEY" || { echo 'Missing BINANCE_TESTNET_API_KEY'; exit 1; }
          test -n "$BINANCE_API_SECRET" || { echo 'Missing BINANCE_TESTNET_API_SECRET'; exit 1; }
          echo "Direct 3rd-party test: Binance Futures Testnet / $TEST_SYMBOL / quantity=$TEST_QUANTITY"
          echo 'Safety: manual-only; this target never runs from schedule.'

      - name: Read Binance Testnet server time
        id: time
        shell: bash
        run: |
          set -euo pipefail
          time_json="$(curl --silent --show-error --connect-timeout 10 --max-time 20 --retry 2 "$BINANCE_TESTNET_BASE_URL/fapi/v1/time")"
          timestamp="$(printf '%s' "$time_json" | jq -er '.serverTime')"
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"

      - name: Place Binance Testnet market entry
        shell: bash
        run: |
          set -euo pipefail
          timestamp='${{ steps.time.outputs.timestamp }}'; query="symbol=$TEST_SYMBOL&side=BUY&type=MARKET&quantity=$TEST_QUANTITY&timestamp=$timestamp&recvWindow=5000"; signature="$(printf '%s' "$query" | openssl dgst -sha256 -hmac "$BINANCE_API_SECRET" | awk '{print $NF}')"; response_file="$(mktemp)"; trap 'rm -f "$response_file"' EXIT
          http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --request POST --header "X-MBX-APIKEY: $BINANCE_API_KEY" --data "$query&signature=$signature" "$BINANCE_TESTNET_BASE_URL/fapi/v1/order")"
          echo "Entry HTTP $http_code"; jq -c '{orderId, symbol, side, status, executedQty, code, msg}' "$response_file" 2>/dev/null || cat "$response_file"
          test "$http_code" = '200' || test "$http_code" = '201'
          jq -e '.orderId != null and .symbol == "BTCUSDT" and .side == "BUY"' "$response_file" >/dev/null

      - name: Close Binance Testnet position with reduce-only market order
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          timestamp="$(curl --silent --show-error --connect-timeout 10 --max-time 20 "$BINANCE_TESTNET_BASE_URL/fapi/v1/time" | jq -er '.serverTime')"; query="symbol=$TEST_SYMBOL&side=SELL&type=MARKET&quantity=$TEST_QUANTITY&reduceOnly=true&timestamp=$timestamp&recvWindow=5000"; signature="$(printf '%s' "$query" | openssl dgst -sha256 -hmac "$BINANCE_API_SECRET" | awk '{print $NF}')"; response_file="$(mktemp)"; trap 'rm -f "$response_file"' EXIT
          http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --request POST --header "X-MBX-APIKEY: $BINANCE_API_KEY" --data "$query&signature=$signature" "$BINANCE_TESTNET_BASE_URL/fapi/v1/order")"
          echo "Close HTTP $http_code"; jq -c '{orderId, symbol, side, status, executedQty, code, msg}' "$response_file" 2>/dev/null || cat "$response_file"
          test "$http_code" = '200' || test "$http_code" = '201'; jq -e '.orderId != null and .symbol == "BTCUSDT" and .side == "SELL"' "$response_file" >/dev/null
          echo "Testnet position close accepted: orderId=$(jq -r '.orderId' "$response_file") status=$(jq -r '.status // "unknown"' "$response_file")"

      - name: Report order integration result
        if: ${{ always() }}
        shell: bash
        run: echo 'WF-07 direct Binance Testnet order integration completed.'
