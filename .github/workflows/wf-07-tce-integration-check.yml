name: WF-07 TCE Integration Check

on:
  workflow_dispatch:
    inputs:
      target:
        description: Integration target
        required: true
        default: all
        type: choice
        options: [all, binance-testnet, staging-api]
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: tce-integration-check
  cancel-in-progress: false

env:
  BINANCE_TESTNET_BASE_URL: https://testnet.binancefuture.com

jobs:
  binance-testnet:
    name: Binance Testnet private API
    if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'binance-testnet' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run Binance public and private checks in parallel
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BINANCE_API_KEY" || { echo 'Missing BINANCE_TESTNET_API_KEY'; exit 1; }
          test -n "$BINANCE_API_SECRET" || { echo 'Missing BINANCE_TESTNET_API_SECRET'; exit 1; }
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          public_check() {
            code="$(curl --silent --show-error --output "$workdir/public.body" --write-out '%{http_code}' --connect-timeout 10 --max-time 20 --retry 2 "$BINANCE_TESTNET_BASE_URL/fapi/v1/ping")" || { echo 'Binance Testnet public curl failed'; return 1; }
            echo "Binance Testnet public HTTP $code"
            test "$code" = '200'
            jq -e 'type == "object"' "$workdir/public.body" >/dev/null
          }

          private_check() {
            time_json="$(curl --silent --show-error --connect-timeout 10 --max-time 20 --retry 2 "$BINANCE_TESTNET_BASE_URL/fapi/v1/time")" || { echo 'Binance server-time curl failed'; return 1; }
            timestamp="$(printf '%s' "$time_json" | jq -er '.serverTime')"
            query="timestamp=${timestamp}&recvWindow=5000"
            signature="$(printf '%s' "$query" | openssl dgst -sha256 -hmac "$BINANCE_API_SECRET" | awk '{print $NF}')"
            url="$BINANCE_TESTNET_BASE_URL/fapi/v2/account?${query}&signature=${signature}"
            http_code="$(curl --silent --show-error --output "$workdir/private.body" --write-out '%{http_code}' --connect-timeout 10 --max-time 30 --header "X-MBX-APIKEY: $BINANCE_API_KEY" "$url")" || { echo 'Binance Testnet private curl failed'; return 1; }
            echo "Binance Testnet private HTTP $http_code"
            if [ "$http_code" != '200' ]; then
              jq -c '{code, msg}' "$workdir/private.body" 2>/dev/null || cat "$workdir/private.body"
              return 1
            fi
            # A successful signed USER_DATA request is the integration signal.
            # Testnet can return an empty object, so do not require production account fields.
            jq -e 'type == "object" and (has("code") | not)' "$workdir/private.body" >/dev/null
            echo "Binance Testnet private API: OK (canTrade=$(jq -r '.canTrade // "unknown"' "$workdir/private.body"))"
          }

          public_check >"$workdir/public.log" 2>&1 & public_pid=$!
          private_check >"$workdir/private.log" 2>&1 & private_pid=$!
          public_status=0; private_status=0
          wait "$public_pid" || public_status=$?
          wait "$private_pid" || private_status=$?
          echo '=== PUBLIC CHECK LOG ==='; cat "$workdir/public.log"
          echo '=== PRIVATE CHECK LOG ==='; cat "$workdir/private.log"
          test "$public_status" -eq 0
          test "$private_status" -eq 0

  staging-api:
    name: TCE staging → Binance Testnet integration
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'staging-api') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TCE_STG_URL: ${{ secrets.TCE_STG_URL }}
      TCE_STG_JWT: ${{ secrets.TCE_STG_JWT }}
    steps:
      - name: Check staging integration configuration
        shell: bash
        run: |
          set -euo pipefail
          target='${{ github.event.inputs.target }}'
          if [ -z "$TCE_STG_URL" ] || [ -z "$TCE_STG_JWT" ]; then
            if [ "$target" = 'staging-api' ]; then echo 'Missing TCE_STG_URL or TCE_STG_JWT for requested staging integration.'; exit 1; fi
            echo 'TCE staging secrets are not configured; staging integration will be skipped.'; exit 0
          fi
          echo 'TCE staging integration configuration: OK'
      - name: Check TCE staging Binance connection
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TCE_STG_URL" ] || [ -z "$TCE_STG_JWT" ]; then echo 'Staging integration skipped because credentials are not configured.'; exit 0; fi
          base_url="${TCE_STG_URL%/}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --request POST --header 'Accept: application/json' --header 'Content-Type: application/json' --header "Authorization: Bearer $TCE_STG_JWT" --data '{"environment":"testnet"}' "$base_url/api/platform/credentials/binance/test")"
          if [ "$http_code" != '200' ]; then echo "TCE staging Binance integration failed with HTTP $http_code"; jq -c '{statusCode, message, error}' "$response_file" 2>/dev/null || true; exit 1; fi
          jq -e '.ok == true and .data.connected == true and .data.environment == "testnet"' "$response_file" >/dev/null
          echo 'TCE staging → Binance Testnet integration: OK'
