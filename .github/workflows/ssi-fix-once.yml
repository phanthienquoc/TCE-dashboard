name: ssi-fix-once
on:
  push:
    branches: [fix/ssi-clientid-cleanup]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply SSI server client configuration
        shell: python
        run: |
          from pathlib import Path
          p=Path('libs/ssi/src/ssi.broker.adapter.ts')
          s=p.read_text()
          s=s.replace('  apiSecret: string;\n  privateKey?: string;', '  apiSecret: string;\n  clientId?: string;\n  privateKey?: string;', 1)
          marker="    if (!this.config.apiKey || !this.config.apiSecret)\n      throw new Error('SSI apiKey/apiSecret are required');\n"
          if marker in s and 'const clientId = this.config.clientId' not in s:
              s=s.replace(marker, marker+"    const clientId = this.config.clientId ?? process.env.SSI_CLIENT_ID ?? '';\n    if (!clientId) throw new Error('SSI clientId is not configured on the server');\n", 1)
          s=s.replace('        apiKey: this.config.apiKey,\n        apiSecret: this.config.apiSecret,', '        clientId,\n        apiKey: this.config.apiKey,\n        apiSecret: this.config.apiSecret,', 1)
          old="    const data = response?.data ?? candidate?.data;\n    const status = response?.status ?? candidate?.status ?? candidate?.statusCode;\n    const message = error instanceof Error ? error.message : String(error);"
          new="    const data = response?.data ?? candidate?.data ?? candidate?.responseBody;\n    const status = response?.status ?? candidate?.status ?? candidate?.statusCode;\n    const code = candidate?.code ? ` code=${String(candidate.code)}` : '';\n    const message = error instanceof Error ? error.message : String(error);"
          s=s.replace(old,new,1)
          s=s.replace("    return `${status ? `HTTP ${status}: ` : ''}${message}${detail}`;", "    return `${status ? `HTTP ${status}: ` : ''}${message}${code}${detail}`;",1)
          p.write_text(s)
          p=Path('apps/service/src/platform/ssi.application.service.ts')
          s=p.read_text()
          if 'clientId: String(process.env.SSI_CLIENT_ID' not in s:
              s=s.replace('        apiKey,\n        apiSecret,\n        privateKey:', "        apiKey,\n        apiSecret,\n        clientId: String(process.env.SSI_CLIENT_ID ?? raw.clientId ?? ''),\n        privateKey:",1)
          p.write_text(s)
          p=Path('.env.example')
          s=p.read_text()
          if 'SSI_CLIENT_ID=' not in s: p.write_text(s+'SSI_CLIENT_ID=\n')
      - name: Remove workflow and commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/ssi-fix-once.yml
          git add -A
          git commit -m 'fix(ssi): restore server-side portfolio client configuration' || exit 0
          git push origin HEAD:fix/ssi-clientid-cleanup
# trigger