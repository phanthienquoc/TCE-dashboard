name: Platform Infra image release

on:
  workflow_run:
    workflows: ["WF-03 TCE Production Deploy"]
    types: [completed]

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Download exact WF-03 release artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: tce-*-image
          merge-multiple: true
          path: /tmp/images

      - name: Load and validate exact release images
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          SHA="${RELEASE_SHA::7}"
          VERSION="$(node -p "require('./package.json').version")"
          TAG="prod-v${VERSION}-${SHA}"
          echo "Release tag: $TAG"

          for image in tce-frontend tce-service; do
            test -s "/tmp/images/$image.tar"
            test -s "/tmp/images/$image.sha256"
            (cd /tmp/images && sha256sum -c "$image.sha256")
            docker load -i "/tmp/images/$image.tar"
            docker image inspect "$image:$TAG" >/dev/null
            test "$(docker image inspect "$image:$TAG" --format '{{.Architecture}}')" = "arm64"
          done

          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish exact release images to GHCR
        run: |
          set -euo pipefail
          docker tag "tce-frontend:$TAG" "ghcr.io/phanthienquoc/tce-dashboard/web:$TAG"
          docker tag "tce-service:$TAG" "ghcr.io/phanthienquoc/tce-dashboard/service:$TAG"
          docker push "ghcr.io/phanthienquoc/tce-dashboard/web:$TAG"
          docker push "ghcr.io/phanthienquoc/tce-dashboard/service:$TAG"

      - name: Notify platform-infra
        env:
          TOKEN: ${{ secrets.PLATFORM_INFRA_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN" || {
            echo "PLATFORM_INFRA_TOKEN is required for production GitOps promotion."
            exit 1
          }

          dispatch() {
            local component="$1"
            curl --fail-with-body -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/phanthienquoc/platform-infra/dispatches \
              -d "{\"event_type\":\"image-published\",\"client_payload\":{\"app\":\"tce-dashboard\",\"component\":\"$component\",\"tag\":\"$TAG\"}}"
          }

          dispatch web
          dispatch service
