name: 'WF-08B TCE MicroFE Build Publish'

'on':
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - microfe/**
      - .github/workflows/wf-08b-tce-microfe-build-publish.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: microfe-build-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, linux, arm64, platform-infra, k3s, vps]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"

      - name: Test MicroFE services
        run: |
          set -euo pipefail
          node --version
          npm --version
          (
            cd microfe/auth
            npm install
            npm run check
            npm test
          )
          (
            cd microfe/ws-gateway
            npm install
            npm run check
            npm test
          )

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish MicroFE images
        run: |
          set -euo pipefail
          docker buildx version
          mkdir -p /tmp/microfe-build-meta
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="$GITHUB_SHA"

          build_image() {
            local image="$1"
            local dockerfile="$2"
            local context="$3"
            local meta="$4"

            docker buildx build --platform linux/arm64 --provenance=true --sbom=true --metadata-file "$meta" --push --tag "$image:$tag" --file "$dockerfile" "$context"

            node - "$meta" "$image" "$tag" <<'NODE'
const fs = require('node:fs');
const [meta, image, tag] = process.argv.slice(2);
const data = JSON.parse(fs.readFileSync(meta, 'utf8'));
const digest = data['containerimage.digest'];
if (typeof digest !== 'string' || !digest.startsWith('sha256:')) {
  console.error(`Missing image digest for ${image}:${tag}`);
  process.exit(1);
}
process.stdout.write(`${image}=${digest}\n`);
NODE
          }

          build_image "ghcr.io/$owner/microfe-auth" "microfe/auth/Dockerfile" "." "/tmp/microfe-build-meta/auth.json" | tee /tmp/microfe-auth.txt
          build_image "ghcr.io/$owner/microfe-shell" "microfe/shell/Dockerfile" "." "/tmp/microfe-build-meta/shell.json" | tee /tmp/microfe-shell.txt
          build_image "ghcr.io/$owner/microfe-ws" "microfe/ws-gateway/Dockerfile" "." "/tmp/microfe-build-meta/ws.json" | tee /tmp/microfe-ws.txt

      - name: Dispatch immutable image promotion
        env:
          PLATFORM_INFRA_TOKEN: ${{ secrets.PLATFORM_INFRA_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${PLATFORM_INFRA_TOKEN:-}"
          auth_digest="$(cut -d= -f2 /tmp/microfe-auth.txt)"
          shell_digest="$(cut -d= -f2 /tmp/microfe-shell.txt)"
          ws_digest="$(cut -d= -f2 /tmp/microfe-ws.txt)"
          for digest in "$auth_digest" "$shell_digest" "$ws_digest"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          done

          node <<'NODE' > /tmp/microfe-dispatch.json
const fs = require('node:fs');
const digestFrom = (path) => fs.readFileSync(path, 'utf8').trim().split('=', 2)[1];
const payload = {
  event_type: 'microfe-images-published',
  client_payload: {
    commit: process.env.GITHUB_SHA,
    auth_digest: digestFrom('/tmp/microfe-auth.txt'),
    shell_digest: digestFrom('/tmp/microfe-shell.txt'),
    ws_digest: digestFrom('/tmp/microfe-ws.txt'),
  },
};
process.stdout.write(JSON.stringify(payload) + '\n');
NODE

          DISPATCHED_AT="$(date -u +%s)"
          echo "DISPATCHED_AT=$DISPATCHED_AT" >> "$GITHUB_ENV"
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PLATFORM_INFRA_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/phanthienquoc/platform-infra/dispatches" \
            -d @/tmp/microfe-dispatch.json

      - name: Verify platform-infra MicroFE reconciliation
        env:
          PLATFORM_INFRA_TOKEN: ${{ secrets.PLATFORM_INFRA_TOKEN }}
        run: |
          set -euo pipefail
          REPO="phanthienquoc/platform-infra"
          API="https://api.github.com/repos/$REPO/actions/runs"

          echo "Waiting for platform-infra MicroFE reconciliation workflow..."
          RUN_ID=""
          for attempt in $(seq 1 18); do
            RUN_ID="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $PLATFORM_INFRA_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API?event=repository_dispatch&per_page=50" |
              jq -r --argjson cutoff "$DISPATCHED_AT" '
                [.workflow_runs[]
                  | select(.name == "reconcile-microfe")
                  | select(.created_at != null)
                  | select((.created_at | fromdateiso8601) >= ($cutoff - 10))]
                | sort_by(.created_at)
                | last
                | .id // empty')"

            if [ -n "$RUN_ID" ]; then
              echo "MicroFE reconciliation workflow detected: $RUN_ID"
              break
            fi
            echo "No MicroFE reconciliation run yet (attempt $attempt/18)."
            sleep 5
          done

          test -n "$RUN_ID" || {
            echo "::error::platform-infra accepted the dispatch but did not schedule reconcile-microfe within 90 seconds."
            exit 1
          }

          for attempt in $(seq 1 36); do
            RUN_JSON="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $PLATFORM_INFRA_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API/$RUN_ID")"
            STATUS="$(printf '%s' "$RUN_JSON" | jq -r '.status')"
            CONCLUSION="$(printf '%s' "$RUN_JSON" | jq -r '.conclusion // empty')"

            echo "MicroFE reconcile: status=$STATUS conclusion=${CONCLUSION:-pending}"
            if [ "$STATUS" = "completed" ]; then
              test "$CONCLUSION" = "success" || {
                echo "::error::platform-infra reconcile-microfe failed: conclusion=$CONCLUSION"
                exit 1
              }
              echo "MicroFE production reconciliation completed successfully."
              exit 0
            fi
            sleep 5
          done

          echo "::error::platform-infra reconcile-microfe did not complete within 180 seconds."
          exit 1
