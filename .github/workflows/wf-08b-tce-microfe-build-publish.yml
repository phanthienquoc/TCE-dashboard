
    if: ${{ github.event_name != 'pull_request' }}
    if: ${{ github.event_name != 'pull_request' }}
    if: ${{ github.event_name != 'pull_request' }}
    if: ${{ github.event_name != 'pull_request' }}name: 'WF-08B TCE MicroFE Build Publish'

'on':
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - microfe/**
      - .github/workflows/wf-08b-tce-microfe-build-publish.yml
  pull_request:
    paths:
      - microfe/**
      - .github/workflows/wf-08b-tce-microfe-build-publish.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: microfe-build-publish
  cancel-in-progress: false

jobs:
  test-auth:
    name: Test MicroFE Auth
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"

      - name: Check and test Auth
        working-directory: microfe/auth
        run: |
          set -euo pipefail
          npm install
          npm run check
          npm test

  test-ws:
    name: Test MicroFE WebSocket
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"

      - name: Check and test WebSocket
        working-directory: microfe/ws-gateway
        run: |
          set -euo pipefail
          npm install
          npm run check
          npm test

  build-auth:
    name: Build and publish MicroFE Auth image
    needs:
      - test-auth
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db
        with:
          driver: docker-container

      - name: Build and publish Auth image
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/microfe-auth
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/microfe-build-meta
          docker buildx build \
            --platform linux/arm64 \
            --provenance=true \
            --sbom=true \
            --metadata-file /tmp/microfe-build-meta/auth.json \
            --push \
            --tag "$IMAGE:$TAG" \
            --file microfe/auth/Dockerfile .
          DIGEST="$(node -e "const d=require('/tmp/microfe-build-meta/auth.json')['containerimage.digest']; if(typeof d!=='string'||!d.startsWith('sha256:'))process.exit(1); process.stdout.write(d)")"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "$IMAGE=$DIGEST" > /tmp/microfe-auth.txt

      - name: Upload Auth image metadata
        uses: actions/upload-artifact@v4
        with:
          name: microfe-auth-metadata
          path: /tmp/microfe-auth.txt
          if-no-files-found: error
          retention-days: 1

  build-ws:
    name: Build and publish MicroFE WebSocket image
    needs:
      - test-ws
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db
        with:
          driver: docker-container

      - name: Build and publish WebSocket image
        run: |
          set -euo pipefail
          mkdir -p /tmp/microfe-build-meta
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/microfe-ws"
          TAG="$GITHUB_SHA"
          docker buildx build \
            --platform linux/arm64 \
            --provenance=true \
            --sbom=true \
            --metadata-file /tmp/microfe-build-meta/ws.json \
            --push \
            --tag "$IMAGE:$TAG" \
            --file microfe/ws-gateway/Dockerfile .
          DIGEST="$(node -e "const d=require('/tmp/microfe-build-meta/ws.json')['containerimage.digest']; if(typeof d!=='string'||!d.startsWith('sha256:'))process.exit(1); process.stdout.write(d)")"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "$IMAGE=$DIGEST" > /tmp/microfe-ws.txt

      - name: Upload WebSocket image metadata
        uses: actions/upload-artifact@v4
        with:
          name: microfe-ws-metadata
          path: /tmp/microfe-ws.txt
          if-no-files-found: error
          retention-days: 1

  build-shell:
    name: Build and publish MicroFE Shell image
    needs:
      - test-auth
      - test-ws
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db
        with:
          driver: docker-container

      - name: Build and publish Shell image
        run: |
          set -euo pipefail
          mkdir -p /tmp/microfe-build-meta
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/microfe-shell"
          TAG="$GITHUB_SHA"
          docker buildx build \
            --platform linux/arm64 \
            --provenance=true \
            --sbom=true \
            --metadata-file /tmp/microfe-build-meta/shell.json \
            --push \
            --tag "$IMAGE:$TAG" \
            --file microfe/shell/Dockerfile .
          DIGEST="$(node -e "const d=require('/tmp/microfe-build-meta/shell.json')['containerimage.digest']; if(typeof d!=='string'||!d.startsWith('sha256:'))process.exit(1); process.stdout.write(d)")"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "$IMAGE=$DIGEST" > /tmp/microfe-shell.txt

      - name: Upload Shell image metadata
        uses: actions/upload-artifact@v4
        with:
          name: microfe-shell-metadata
          path: /tmp/microfe-shell.txt
          if-no-files-found: error
          retention-days: 1

  dispatch-and-verify:
    name: Dispatch immutable image promotion and verify production
    needs:
      - build-auth
      - build-shell
      - build-ws
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download all image metadata
        uses: actions/download-artifact@v4
        with:
          pattern: microfe-*-metadata
          merge-multiple: true
          path: /tmp/microfe-build-meta

      - name: Validate image digests and dispatch promotion
        env:
          PLATFORM_INFRA_TOKEN: ${{ secrets.PLATFORM_INFRA_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${PLATFORM_INFRA_TOKEN:-}"
          test -s /tmp/microfe-build-meta/microfe-auth.txt
          test -s /tmp/microfe-build-meta/microfe-shell.txt
          test -s /tmp/microfe-build-meta/microfe-ws.txt
          auth_digest="$(cut -d= -f2 /tmp/microfe-build-meta/microfe-auth.txt)"
          shell_digest="$(cut -d= -f2 /tmp/microfe-build-meta/microfe-shell.txt)"
          ws_digest="$(cut -d= -f2 /tmp/microfe-build-meta/microfe-ws.txt)"
          for digest in "$auth_digest" "$shell_digest" "$ws_digest"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Invalid image digest: $digest"; exit 1; }
          done

          node <<'NODE' > /tmp/microfe-dispatch.json
          const fs = require('node:fs');
          const digestFrom = (path) => fs.readFileSync(path, 'utf8').trim().split('=', 2)[1];
          const payload = {
            event_type: 'microfe-images-published',
            client_payload: {
              commit: process.env.GITHUB_SHA,
              auth_digest: digestFrom('/tmp/microfe-build-meta/microfe-auth.txt'),
              shell_digest: digestFrom('/tmp/microfe-build-meta/microfe-shell.txt'),
              ws_digest: digestFrom('/tmp/microfe-build-meta/microfe-ws.txt'),
            },
          };
          process.stdout.write(JSON.stringify(payload) + '\n');
          NODE

          DISPATCHED_AT="$(date -u +%s)"
          echo "DISPATCHED_AT=$DISPATCHED_AT" >> "$GITHUB_ENV"
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PLATFORM_INFRA_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/phanthienquoc/platform-infra/dispatches" \
            -d @/tmp/microfe-dispatch.json

      - name: Verify platform-infra MicroFE reconciliation
        env:
          PLATFORM_INFRA_TOKEN: ${{ secrets.PLATFORM_INFRA_TOKEN }}
        run: |
          set -euo pipefail
          REPO="phanthienquoc/platform-infra"
          API="https://api.github.com/repos/$REPO/actions/runs"

          echo "Waiting for platform-infra MicroFE reconciliation workflow..."
          RUN_ID=""
          for attempt in $(seq 1 18); do
            RUN_ID="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $PLATFORM_INFRA_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API?event=repository_dispatch&per_page=50" |
              jq -r --argjson cutoff "$DISPATCHED_AT" '
                [.workflow_runs[]
                  | select(.name == "reconcile-microfe")
                  | select(.created_at != null)
                  | select((.created_at | fromdateiso8601) >= ($cutoff - 10))]
                | sort_by(.created_at)
                | last
                | .id // empty')"

            if [ -n "$RUN_ID" ]; then
              echo "MicroFE reconciliation workflow detected: $RUN_ID"
              break
            fi
            echo "No MicroFE reconciliation run yet (attempt $attempt/18)."
            sleep 5
          done

          test -n "$RUN_ID" || {
            echo "::error::platform-infra accepted the dispatch but did not schedule reconcile-microfe within 90 seconds."
            exit 1
          }

          for attempt in $(seq 1 36); do
            RUN_JSON="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $PLATFORM_INFRA_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API/$RUN_ID")"
            STATUS="$(printf '%s' "$RUN_JSON" | jq -r '.status')"
            CONCLUSION="$(printf '%s' "$RUN_JSON" | jq -r '.conclusion // empty')"

            echo "MicroFE reconcile: status=$STATUS conclusion=${CONCLUSION:-pending}"
            if [ "$STATUS" = "completed" ]; then
              test "$CONCLUSION" = "success" || {
                echo "::error::platform-infra reconcile-microfe failed: conclusion=$CONCLUSION"
                exit 1
              }
              echo "MicroFE production reconciliation completed successfully."
              exit 0
            fi
            sleep 5
          done

          echo "::error::platform-infra reconcile-microfe did not complete within 180 seconds."
          exit 1
