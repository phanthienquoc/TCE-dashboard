name: 'WF-08B TCE MicroFE Build Publish'

'on':
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - microfe/auth/**
      - microfe/ws-gateway/**
      - .github/workflows/wf-08b-tce-microfe-build-publish.yml
  push:
    branches: [master]
    paths:
      - microfe/**
      - .github/workflows/wf-08b-tce-microfe-build-publish.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: microfe-build-publish
  cancel-in-progress: false

jobs:
  test-auth:
    name: Test MicroFE Auth
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"

      - name: Check and test Auth
        working-directory: microfe/auth
        run: |
          set -euo pipefail
          npm install
          npm run check
          npm test

  test-ws:
    name: Test MicroFE WebSocket
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"

      - name: Check and test WebSocket
        working-directory: microfe/ws-gateway
        run: |
          set -euo pipefail
          npm install
          npm run check
          npm test

  validate-release-handoff:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    name: Validate Platform Infra release handoff credential
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require release credential and verify repository access before publishing
        env:
          PLATFORM_INFRA_TOKEN: ${{ secrets.PLATFORM_INFRA_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PLATFORM_INFRA_TOKEN:-}" ]]; then
            echo "::error::Configure PLATFORM_INFRA_TOKEN with Contents: write on phanthienquoc/platform-infra before publishing images."
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PLATFORM_INFRA_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/phanthienquoc/platform-infra" |
            jq -e '.full_name == "phanthienquoc/platform-infra"'

  build-auth:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    name: Build and publish MicroFE Auth image
    needs:
      - test-auth
      - validate-release-handoff
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db
        with:
          driver: docker-container

      - name: Build and publish Auth image
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/microfe-auth
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/microfe-build-meta
          docker buildx build \
            --platform linux/arm64 \
            --provenance=true \
            --sbom=true \
            --metadata-file /tmp/microfe-build-meta/auth.json \
            --push \
            --tag "$IMAGE:$TAG" \
            --file microfe/auth/Dockerfile .
          DIGEST="$(node -e "const d=require('/tmp/microfe-build-meta/auth.json')['containerimage.digest']; if(typeof d!=='string'||!d.startsWith('sha256:'))process.exit(1); process.stdout.write(d)")"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "$IMAGE=$DIGEST" > /tmp/microfe-auth.txt

      - name: Upload Auth image metadata
        uses: actions/upload-artifact@v4
        with:
          name: microfe-auth-metadata
          path: /tmp/microfe-auth.txt
          if-no-files-found: error
          retention-days: 1

  build-ws:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    name: Build and publish MicroFE WebSocket image
    needs:
      - test-ws
      - validate-release-handoff
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db
        with:
          driver: docker-container

      - name: Build and publish WebSocket image
        run: |
          set -euo pipefail
          mkdir -p /tmp/microfe-build-meta
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/microfe-ws"
          TAG="$GITHUB_SHA"
          docker buildx build \
            --platform linux/arm64 \
            --provenance=true \
            --sbom=true \
            --metadata-file /tmp/microfe-build-meta/ws.json \
            --push \
            --tag "$IMAGE:$TAG" \
            --file microfe/ws-gateway/Dockerfile .
          DIGEST="$(node -e "const d=require('/tmp/microfe-build-meta/ws.json')['containerimage.digest']; if(typeof d!=='string'||!d.startsWith('sha256:'))process.exit(1); process.stdout.write(d)")"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "$IMAGE=$DIGEST" > /tmp/microfe-ws.txt

      - name: Upload WebSocket image metadata
        uses: actions/upload-artifact@v4
        with:
          name: microfe-ws-metadata
          path: /tmp/microfe-ws.txt
          if-no-files-found: error
          retention-days: 1

  build-shell:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    name: Build and publish MicroFE Shell image
    needs:
      - test-auth
      - test-ws
      - validate-release-handoff
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db
        with:
          driver: docker-container

      - name: Build and publish Shell image
        run: |
          set -euo pipefail
          mkdir -p /tmp/microfe-build-meta
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/microfe-shell"
          TAG="$GITHUB_SHA"
          docker buildx build \
            --platform linux/arm64 \
            --provenance=true \
            --sbom=true \
            --metadata-file /tmp/microfe-build-meta/shell.json \
            --push \
            --tag "$IMAGE:$TAG" \
            --file microfe/shell/Dockerfile .
          DIGEST="$(node -e "const d=require('/tmp/microfe-build-meta/shell.json')['containerimage.digest']; if(typeof d!=='string'||!d.startsWith('sha256:'))process.exit(1); process.stdout.write(d)")"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "$IMAGE=$DIGEST" > /tmp/microfe-shell.txt

      - name: Upload Shell image metadata
        uses: actions/upload-artifact@v4
        with:
          name: microfe-shell-metadata
          path: /tmp/microfe-shell.txt
          if-no-files-found: error
          retention-days: 1

  dispatch-and-verify:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    name: Dispatch immutable image promotion and verify production
    needs:
      - build-auth
      - build-shell
      - build-ws
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download all image metadata
        uses: actions/download-artifact@v4
        with:
          pattern: microfe-*-metadata
          merge-multiple: true
          path: /tmp/microfe-build-meta

      - name: Validate image digests and dispatch promotion
        env:
          PLATFORM_INFRA_TOKEN: ${{ secrets.PLATFORM_INFRA_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${PLATFORM_INFRA_TOKEN:-}"
          test -s /tmp/microfe-build-meta/microfe-auth.txt
          test -s /tmp/microfe-build-meta/microfe-shell.txt
          test -s /tmp/microfe-build-meta/microfe-ws.txt
          auth_digest="$(cut -d= -f2 /tmp/microfe-build-meta/microfe-auth.txt)"
          shell_digest="$(cut -d= -f2 /tmp/microfe-build-meta/microfe-shell.txt)"
          ws_digest="$(cut -d= -f2 /tmp/microfe-build-meta/microfe-ws.txt)"
          for digest in "$auth_digest" "$shell_digest" "$ws_digest"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Invalid image digest: $digest"; exit 1; }
          done

          node <<'NODE' > /tmp/microfe-dispatch.json
          const fs = require('node:fs');
          const digestFrom = (path) => fs.readFileSync(path, 'utf8').trim().split('=', 2)[1];
          const payload = {
            event_type: 'microfe-images-published',
            client_payload: {
              commit: process.env.GITHUB_SHA,
              auth_digest: digestFrom('/tmp/microfe-build-meta/microfe-auth.txt'),
              shell_digest: digestFrom('/tmp/microfe-build-meta/microfe-shell.txt'),
              ws_digest: digestFrom('/tmp/microfe-build-meta/microfe-ws.txt'),
            },
          };
          process.stdout.write(JSON.stringify(payload) + '\n');
          NODE

          DISPATCHED_AT="$(date -u +%s)"
          echo "DISPATCHED_AT=$DISPATCHED_AT" >> "$GITHUB_ENV"
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PLATFORM_INFRA_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/phanthienquoc/platform-infra/dispatches" \
            -d @/tmp/microfe-dispatch.json

      - name: Verify shared GitOps promotion and targeted reconciliation
        env:
          PLATFORM_INFRA_TOKEN: ${{ secrets.PLATFORM_INFRA_TOKEN }}
        run: |
          set -euo pipefail
          REPO="phanthienquoc/platform-infra"
          API="https://api.github.com/repos/$REPO/actions/runs"
          EXPECTED_RELEASE="microfe-${GITHUB_SHA:0:7}"
          EXPECTED_RECONCILE_TITLE="Reconcile VPS — microfe / $EXPECTED_RELEASE"

          api_get() {
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $PLATFORM_INFRA_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }

          echo "Waiting for shared GitOps Image Promotion for $EXPECTED_RELEASE..."
          PROMOTION_RUN_ID=""
          for attempt in $(seq 1 36); do
            RUNS="$(api_get "$API?event=repository_dispatch&per_page=100")"
            PROMOTION_RUN_ID="$(printf '%s' "$RUNS" | jq -r --argjson cutoff "$DISPATCHED_AT" '
              [.workflow_runs[]
                | select(.name == "GitOps Image Promotion")
                | select(.created_at != null)
                | select((.created_at | fromdateiso8601) >= ($cutoff - 10))]
              | sort_by(.created_at)
              | last
              | .id // empty')"
            if [ -n "$PROMOTION_RUN_ID" ]; then
              echo "Shared GitOps promotion run detected: $PROMOTION_RUN_ID"
              break
            fi
            echo "No shared promotion run yet (attempt $attempt/36)."
            sleep 5
          done
          test -n "$PROMOTION_RUN_ID" || {
            echo "::error::platform-infra accepted the image event but did not schedule GitOps Image Promotion within 180 seconds."
            exit 1
          }

          PROMOTION_CREATED_EPOCH=""
          PROMOTION_COMPLETE=false
          for attempt in $(seq 1 180); do
            PROMOTION_JSON="$(api_get "$API/$PROMOTION_RUN_ID")"
            PROMOTION_STATUS="$(printf '%s' "$PROMOTION_JSON" | jq -r '.status')"
            PROMOTION_CONCLUSION="$(printf '%s' "$PROMOTION_JSON" | jq -r '.conclusion // empty')"
            PROMOTION_CREATED_EPOCH="$(printf '%s' "$PROMOTION_JSON" | jq -r '.created_at | fromdateiso8601')"
            echo "GitOps promotion: status=$PROMOTION_STATUS conclusion=${PROMOTION_CONCLUSION:-pending}"
            if [ "$PROMOTION_STATUS" = "completed" ]; then
              test "$PROMOTION_CONCLUSION" = "success" || {
                echo "::error::Shared GitOps image promotion failed: conclusion=$PROMOTION_CONCLUSION"
                exit 1
              }
              PROMOTION_COMPLETE=true
              break
            fi
            sleep 5
          done
          test "$PROMOTION_COMPLETE" = true || {
            echo "::error::Shared GitOps image promotion did not complete within 15 minutes."
            exit 1
          }

          echo "Waiting for the matching targeted reconciliation: $EXPECTED_RECONCILE_TITLE"
          RECONCILE_RUN_ID=""
          for attempt in $(seq 1 36); do
            RUNS="$(api_get "$API?event=repository_dispatch&per_page=100")"
            RECONCILE_RUN_ID="$(printf '%s' "$RUNS" | jq -r --argjson cutoff "$PROMOTION_CREATED_EPOCH" --arg title "$EXPECTED_RECONCILE_TITLE" '
              [.workflow_runs[]
                | select(.name == "reconcile-vps")
                | select(.event == "repository_dispatch")
                | select((.display_title // "") == $title)
                | select(.created_at != null)
                | select((.created_at | fromdateiso8601) >= ($cutoff - 10))]
              | sort_by(.created_at)
              | last
              | .id // empty')"
            if [ -n "$RECONCILE_RUN_ID" ]; then
              echo "Matching MicroFE reconciliation run detected: $RECONCILE_RUN_ID"
              break
            fi
            echo "No matching reconciliation run yet (attempt $attempt/36)."
            sleep 5
          done
          test -n "$RECONCILE_RUN_ID" || {
            echo "::error::GitOps promotion succeeded but the matching MicroFE reconcile-vps run was not scheduled within 180 seconds."
            exit 1
          }

          RECONCILE_COMPLETE=false
          for attempt in $(seq 1 240); do
            RECONCILE_JSON="$(api_get "$API/$RECONCILE_RUN_ID")"
            RECONCILE_STATUS="$(printf '%s' "$RECONCILE_JSON" | jq -r '.status')"
            RECONCILE_CONCLUSION="$(printf '%s' "$RECONCILE_JSON" | jq -r '.conclusion // empty')"
            echo "MicroFE reconcile-vps: status=$RECONCILE_STATUS conclusion=${RECONCILE_CONCLUSION:-pending}"
            if [ "$RECONCILE_STATUS" = "completed" ]; then
              test "$RECONCILE_CONCLUSION" = "success" || {
                echo "::error::Targeted MicroFE reconciliation/health gate failed: conclusion=$RECONCILE_CONCLUSION"
                exit 1
              }
              RECONCILE_COMPLETE=true
              break
            fi
            sleep 5
          done
          test "$RECONCILE_COMPLETE" = true || {
            echo "::error::Targeted MicroFE reconciliation did not complete within 20 minutes."
            exit 1
          }
          echo "Shared GitOps promotion and targeted MicroFE reconciliation/health gate completed successfully."
