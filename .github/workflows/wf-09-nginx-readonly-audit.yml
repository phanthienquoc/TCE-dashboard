name: "WF-09 Nginx Readonly Audit"

on:
  workflow_dispatch:
    inputs:
      host:
        description: "VPS IP/hostname"
        required: true
        default: "132.226.175.206"
      username:
        description: "SSH username"
        required: true
        default: "ubuntu"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key

      - name: Audit Nginx and wildcard domain
        env:
          H: ${{ inputs.host }}
          U: ${{ inputs.username }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/tce_vps_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== NGINX VERSION ==="
          nginx -v 2>&1 || true

          echo "=== NGINX CONFIG TEST ==="
          sudo nginx -t

          echo "=== SERVER NAMES ==="
          sudo nginx -T 2>&1 | grep -E '^\s*server_name\s+' || true

          echo "=== SSL CERTIFICATES ==="
          sudo nginx -T 2>&1 | grep -E 'ssl_certificate(_key)?\s+' || true

          echo "=== PROXY TARGETS ==="
          sudo nginx -T 2>&1 | grep -E '^\s*proxy_pass\s+' || true

          echo "=== WILDCARD / DOMAIN REFERENCES ==="
          sudo nginx -T 2>&1 | grep -Ei 'server_name.*\*\.|\*\.|mrcute\.space' || true

          echo "=== ENABLED SITES ==="
          sudo find /etc/nginx/sites-enabled -maxdepth 1 -type l \
            -printf '%f -> %l\n' 2>/dev/null || true

          echo "=== LISTEN SOCKETS ==="
          sudo nginx -T 2>&1 | grep -E '^\s*listen\s+' || true

          echo "=== LOCAL HTTP/HTTPS CHECK ==="
          curl -sS -I --max-time 10 http://127.0.0.1/ || true
          curl -k -sS -I --max-time 10 https://127.0.0.1/ || true

          echo "=== READ-ONLY AUDIT COMPLETE ==="
          echo "No Nginx files modified. No reload performed."
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/tce_vps_key
