name: WF-12 TCE Healthcheck Schedule Watchdog

'on':
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/wf-12-tce-healthcheck-schedule-watchdog.yml'
  workflow_run:
    workflows:
      - WF-06 TCE Healthcheck
      - WF-07 TCE 3rd-Party Integration Check
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: tce-wf06-schedule-watchdog
  cancel-in-progress: false

jobs:
  verify:
    name: Verify WF-06 schedule delivery
    # WF-07 is an independent scheduled heartbeat; only scheduled WF-06/WF-07 completions may trigger this read-only check.
    if: >-
      ${{ (github.event_name != 'schedule' || github.run_attempt == 1) &&
          (github.event_name != 'workflow_run' ||
           (github.run_attempt == 1 &&
            github.event.workflow_run.run_attempt == 1 &&
            github.event.workflow_run.event == 'schedule' &&
            (github.event.workflow.path == '.github/workflows/wf-06-tce-healthcheck.yml' ||
             github.event.workflow.path == '.github/workflows/wf-07-tce-integration-check.yml'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      MAX_AGE_MINUTES: "25"
      MAX_QUEUE_MINUTES: "15"
    steps:
      - name: Verify WF-06 workflow is enabled
        shell: bash
        run: |
          set -euo pipefail
          workflow="$(gh api \
            -X GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/wf-06-tce-healthcheck.yml")"
          state="$(jq -r '.state // empty' <<< "$workflow")"
          if [[ "$state" != "active" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "::warning::WF-06 is not active (state=${state:-missing}); push smoke is warning-only."
              exit 0
            fi
            echo "::error::WF-06 TCE Healthcheck is not active (state=${state:-missing})."
            exit 1
          fi
          echo "WF-06 workflow state: active"

      - name: Inspect latest scheduled WF-06 run
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api \
            -X GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/wf-06-tce-healthcheck.yml/runs" \
            -f event=schedule \
            -F per_page=1)"
          latest="$(jq -c '.workflow_runs | sort_by(.created_at) | last // empty' <<< "$response")"
          if [[ -z "$latest" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "::warning::WF-06 has no scheduled run yet; push smoke remains warning-only."
              exit 0
            fi
            echo "::error::No scheduled WF-06 run exists in Actions history."
            exit 1
          fi

          # Use GitHub's own timestamp for this watchdog run as the reference clock.
          # Hosted runner wall clocks can differ from the Actions API by an hour; comparing
          # two API-created timestamps avoids false "future run" failures.
          current_run="$(gh api \
            -X GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          reference_at="$(jq -r '.created_at // empty' <<< "$current_run")"
          reference_epoch="$(jq -r 'if .created_at then (.created_at | fromdateiso8601) else empty end' <<< "$current_run")"
          if [[ -z "$reference_at" || -z "$reference_epoch" ]]; then
            echo "::error::Unable to obtain the current watchdog run timestamp from the Actions API."
            exit 1
          fi

          created_at="$(jq -r '.created_at' <<< "$latest")"
          created_epoch="$(jq -r '.created_at | fromdateiso8601' <<< "$latest")"
          run_id="$(jq -r '.id' <<< "$latest")"
          run_url="$(jq -r '.html_url' <<< "$latest")"
          status="$(jq -r '.status' <<< "$latest")"
          conclusion="$(jq -r '.conclusion // "pending"' <<< "$latest")"
          age_seconds=$((reference_epoch - created_epoch))
          age_minutes=$((age_seconds / 60))
          run_attempt="$(jq -r '.run_attempt // 1' <<< "$latest")"
          queue_measurable=true
          if (( run_attempt > 1 )); then
            # GitHub keeps created_at from the original run but updates run_started_at
            # for a re-run attempt. Their difference is not runner queue time.
            queue_measurable=false
            queue_seconds=0
            queue_minutes=0
            echo "::notice::WF-06 queue wait is not measurable on rerun attempt ${run_attempt}; freshness still uses the original scheduled created_at."
          else
            started_at="$(jq -r '.run_started_at // empty' <<< "$latest")"
            if [[ -n "$started_at" ]]; then
              started_epoch="$(jq -r '.run_started_at | fromdateiso8601' <<< "$latest")"
            else
              # A queued run has not acquired a runner yet; measure its wait to this
              # watchdog run API timestamp, not the hosted runner wall clock.
              started_epoch="$reference_epoch"
            fi
            queue_seconds=$((started_epoch - created_epoch))
            queue_minutes=$((queue_seconds / 60))
          fi

          if (( age_seconds < 0 )) || { [[ "$queue_measurable" == true ]] && (( queue_seconds < 0 )); }; then
            echo "::error::Actions API timestamps are inconsistent for WF-06 run #${run_id}; refusing to infer freshness."
            echo "::error::watchdog_reference=${reference_at} scheduled_run=${created_at} started_at=${started_at:-not-started}"
            exit 1
          fi

          stale=0
          if [[ "$queue_measurable" == true ]] && (( queue_seconds > MAX_QUEUE_MINUTES * 60 )); then
            echo "::error::WF-06 run #${run_id} waited ${queue_seconds}s (${queue_minutes}m) for a runner; budget=${MAX_QUEUE_MINUTES}m."
            stale=1
          fi
          if (( age_seconds > MAX_AGE_MINUTES * 60 )); then
            echo "::error::No scheduled WF-06 run within ${MAX_AGE_MINUTES}m; latest age=${age_seconds}s (${age_minutes}m)."
            stale=1
          fi

          if [[ "$queue_measurable" == true ]]; then
            echo "WF-06 run #${run_id}: created=${created_at} age=${age_minutes}m queue=${queue_minutes}m status=${status} conclusion=${conclusion}."
          else
            echo "WF-06 run #${run_id}: created=${created_at} age=${age_minutes}m queue=not-measurable (run_attempt=${run_attempt}) status=${status} conclusion=${conclusion}."
          fi
          echo "Age reference: watchdog run #${GITHUB_RUN_ID} created=${reference_at} (GitHub Actions API clock)."
          echo "Run evidence: ${run_url}"
          echo "Schedule delivery is monitored independently of public endpoint health; a completed WF-06 failure does not mean its schedule was missed."

          if (( stale != 0 )); then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "::warning::Read-only API smoke detected stale WF-06 schedule delivery."
              exit 0
            fi
            exit 1
          fi

          echo "WF-06 schedule delivery is fresh and within runner queue budget."

  dispatch-stale-wf06-recovery:
    name: Request WF-13 recovery after stale WF-06 schedule delivery
    needs: verify
    if: >-
      ${{ failure() &&
          needs.verify.result == 'failure' &&
          github.event_name == 'workflow_run' &&
          github.run_attempt == 1 &&
          github.event.workflow_run.run_attempt == 1 &&
          github.event.workflow_run.workflow_id == 341818078 &&
          github.event.workflow_run.event == 'schedule' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify stale watchdog failure and native WF-07 source
        env:
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$UPSTREAM_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$UPSTREAM_WORKFLOW_ID" == "341818078" ]]
          [[ "$UPSTREAM_EVENT" == "schedule" && "$UPSTREAM_CONCLUSION" == "success" ]]
          [[ "$UPSTREAM_ATTEMPT" == "1" && "$UPSTREAM_BRANCH" == "master" ]]
          [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]

          watchdog_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          jq -e --arg sha "$GITHUB_SHA" '
            .workflow_id == 403352324 and
            .path == ".github/workflows/wf-12-tce-healthcheck-schedule-watchdog.yml" and
            .event == "workflow_run" and
            .head_branch == "master" and
            .head_sha == $sha and
            .run_attempt == 1 and
            .conclusion == "failure"
          ' <<< "$watchdog_run" >/dev/null

          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100")"
          verify_job="$(jq -c '[.jobs[] | select(.name == "Verify WF-06 schedule delivery")] | if length == 1 then .[0] else empty end' <<< "$jobs")"
          [[ -n "$verify_job" ]]
          jq -e '
            .status == "completed" and
            .conclusion == "failure" and
            ([.steps[] | select(.name == "Verify WF-06 workflow is enabled" and .conclusion == "success")] | length == 1) and
            ([.steps[] | select(.name == "Inspect latest scheduled WF-06 run" and .conclusion == "failure")] | length == 1)
          ' <<< "$verify_job" >/dev/null
          echo "Verified stale WF-06 schedule detection in watchdog #$GITHUB_RUN_ID from native WF-07 schedule #$UPSTREAM_RUN_ID."

      - name: Dispatch WF-13 recovery request
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run wf-13-tce-healthcheck-recovery.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            -f "source_run_id=$GITHUB_RUN_ID"

          expected_title="WF-13 TCE Healthcheck Schedule Recovery / source $GITHUB_RUN_ID"
          dispatched_run=""
          for attempt in $(seq 1 8); do
            response="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/wf-13-tce-healthcheck-recovery.yml/runs" -f event=workflow_dispatch -F branch=master -F per_page=100)"
            dispatched_run="$(jq -c --arg title "$expected_title" --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.display_title == $title and .head_branch == "master" and .head_sha == $sha and .event == "workflow_dispatch")] | sort_by(.created_at) | last // empty' <<< "$response")"
            if [[ -n "$dispatched_run" ]]; then
              run_id="$(jq -r '.id' <<< "$dispatched_run")"
              run_url="$(jq -r '.html_url' <<< "$dispatched_run")"
              echo "Verified WF-13 workflow_dispatch recovery request: #$run_id $run_url (source WF-12 #$GITHUB_RUN_ID)."
              exit 0
            fi
            echo "Waiting for WF-13 recovery dispatch correlation (attempt $attempt/8)..."
            sleep 5
          done

          echo "::error::GitHub accepted no correlatable WF-13 workflow_dispatch recovery for source #$GITHUB_RUN_ID."
          exit 1

  notify-platform-infra:
    name: Notify Platform Infra — TCE schedule heartbeat
    if: >-
      ${{ (github.event_name == 'schedule' && github.run_attempt == 1) ||
          (github.event_name == 'workflow_run' &&
           github.run_attempt == 1 &&
           github.event.workflow_run.run_attempt == 1 &&
           github.event.workflow_run.event == 'schedule' &&
           (github.event.workflow.path == '.github/workflows/wf-06-tce-healthcheck.yml' ||
            github.event.workflow.path == '.github/workflows/wf-07-tce-integration-check.yml')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch authenticated schedule heartbeat
        env:
          PLATFORM_INFRA_TOKEN: ${{ secrets.PLATFORM_INFRA_TOKEN }}
          SOURCE_EVENT: ${{ github.event_name == 'schedule' && 'schedule' || github.event.workflow_run.event }}
          SOURCE_WORKFLOW_PATH: ${{ github.event_name == 'schedule' && '.github/workflows/wf-12-tce-healthcheck-schedule-watchdog.yml' || github.event.workflow.path }}
          SOURCE_RUN_ID: ${{ github.event_name == 'schedule' && github.run_id || github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event_name == 'schedule' && github.run_attempt || github.event.workflow_run.run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.event_name == 'schedule' && github.sha || github.event.workflow_run.head_sha }}
          HEARTBEAT_RUN_ID: ${{ github.run_id }}
          HEARTBEAT_RUN_ATTEMPT: ${{ github.run_attempt }}
          HEARTBEAT_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PLATFORM_INFRA_TOKEN:-}" ]] || {
            echo "::error::Configure PLATFORM_INFRA_TOKEN with Contents: write on phanthienquoc/platform-infra to enable the independent schedule heartbeat."
            exit 1
          }
          [[ "$SOURCE_EVENT" == "schedule" ]] || {
            echo "::error::Only scheduled TCE activity may be forwarded as a Platform heartbeat."
            exit 1
          }
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[0-9]+$ && "$HEARTBEAT_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || {
            echo "::error::TCE heartbeat run attempts must be numeric."
            exit 1
          }
          [[ "$SOURCE_RUN_ATTEMPT" == "1" && "$HEARTBEAT_RUN_ATTEMPT" == "1" ]] || {
            echo "::error::Rerun attempts cannot be forwarded as native schedule heartbeats (source=$SOURCE_RUN_ATTEMPT heartbeat=$HEARTBEAT_RUN_ATTEMPT)."
            exit 1
          }
          case "$SOURCE_WORKFLOW_PATH" in
            .github/workflows/wf-06-tce-healthcheck.yml|.github/workflows/wf-07-tce-integration-check.yml|.github/workflows/wf-12-tce-healthcheck-schedule-watchdog.yml) ;;
            *) echo "::error::Unapproved TCE schedule heartbeat source."; exit 1 ;;
          esac
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ && "$HEARTBEAT_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$HEARTBEAT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          payload="$(jq -n \
            --arg source_repository "phanthienquoc/TCE-dashboard" \
            --arg source_event "$SOURCE_EVENT" \
            --arg source_workflow_path "$SOURCE_WORKFLOW_PATH" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_run_attempt "$SOURCE_RUN_ATTEMPT" \
            --arg source_head_sha "$SOURCE_HEAD_SHA" \
            --arg heartbeat_run_id "$HEARTBEAT_RUN_ID" \
            --arg heartbeat_run_attempt "$HEARTBEAT_RUN_ATTEMPT" \
            --arg heartbeat_head_sha "$HEARTBEAT_HEAD_SHA" \
            '{event_type:"tce-schedule-heartbeat",client_payload:{
              source_repository:$source_repository,
              source_event:$source_event,
              source_workflow_path:$source_workflow_path,
              source_run_id:$source_run_id,
              source_run_attempt:$source_run_attempt,
              source_head_sha:$source_head_sha,
              heartbeat_run_id:$heartbeat_run_id,
              heartbeat_run_attempt:$heartbeat_run_attempt,
              heartbeat_head_sha:$heartbeat_head_sha
            }}')"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $PLATFORM_INFRA_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data-binary "$payload" \
            "https://api.github.com/repos/phanthienquoc/platform-infra/dispatches")"
          [[ "$http_code" == "204" ]] || {
            echo "::error::Platform Infra schedule heartbeat dispatch returned HTTP $http_code."
            cat "$response_file"
            exit 1
          }
          echo "Verified Platform Infra schedule heartbeat accepted: source=$SOURCE_WORKFLOW_PATH run=$SOURCE_RUN_ID attempt=$SOURCE_RUN_ATTEMPT sha=$SOURCE_HEAD_SHA heartbeat_run=$HEARTBEAT_RUN_ID attempt=$HEARTBEAT_RUN_ATTEMPT."
