name: "WF-11 TCE Nginx Domain"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "TCE environment"
        required: true
        type: choice
        options:
          - stg
          - prod
        default: stg
      enable_ssl:
        description: "Enable/renew HTTPS with Certbot"
        required: true
        type: boolean
        default: true
      dry_run:
        description: "Audit only; do not modify Nginx or reload"
        required: true
        type: boolean
        default: false

env:
  VPS_HOST: 132.226.175.206
  VPS_USER: ubuntu
  NGINX_UPSTREAM: 127.0.0.1:80

jobs:
  configure-domain:
    name: Configure TCE ${{ inputs.environment }} domain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key
          ssh-keygen -y -f ~/.ssh/tce_vps_key >/dev/null

      - name: Configure Nginx and HTTPS
        env:
          H: ${{ env.VPS_HOST }}
          U: ${{ env.VPS_USER }}
          ENV_NAME: ${{ inputs.environment }}
          SSL: ${{ inputs.enable_ssl }}
          DRY_RUN: ${{ inputs.dry_run }}
          UPSTREAM: ${{ env.NGINX_UPSTREAM }}
        run: |
          set -euo pipefail

          if [ "$ENV_NAME" = "stg" ]; then
            DOMAIN="tce-stg.mrcute.space"
          else
            DOMAIN="tce.mrcute.space"
          fi

          export DOMAIN
          echo "Environment : $ENV_NAME"
          echo "Domain      : $DOMAIN"
          echo "Upstream    : $UPSTREAM"
          echo "SSL         : $SSL"
          echo "Dry run     : $DRY_RUN"

          ssh -i ~/.ssh/tce_vps_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            "$U@$H" "DOMAIN='$DOMAIN' ENV_NAME='$ENV_NAME' SSL='$SSL' DRY_RUN='$DRY_RUN' UPSTREAM='$UPSTREAM' bash -s" <<'REMOTE'
          set -euo pipefail

          CFG="/etc/nginx/sites-available/${DOMAIN}"
          LINK="/etc/nginx/sites-enabled/${DOMAIN}"
          TMP="/tmp/tce-nginx-${ENV_NAME}.conf"
          ACME_ROOT="/var/www/tce-acme"

          echo "=== PRECHECK ==="
          sudo nginx -t
          getent hosts "$DOMAIN" || true
          curl -sS -I --max-time 10 "http://${DOMAIN}/" || true

          # Dedicated ACME webroot avoids Certbot's temporary nginx config.
          # This is important because the normal / location proxies to the TCE upstream.
          sudo mkdir -p "$ACME_ROOT/.well-known/acme-challenge"
          sudo chown -R www-data:www-data "$ACME_ROOT"

          cat > "$TMP" <<EOF
          server {
              listen 80;
              listen [::]:80;
              server_name ${DOMAIN};

              location ^~ /.well-known/acme-challenge/ {
                  root ${ACME_ROOT};
                  default_type text/plain;
                  try_files \$uri =404;
              }

              location / {
                  proxy_pass http://${UPSTREAM};
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
          }
          EOF

          echo "=== GENERATED CONFIG ==="
          cat "$TMP"

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN: no Nginx files modified and no reload performed."
            exit 0
          fi

          sudo install -m 0644 "$TMP" "$CFG"
          sudo ln -sfn "$CFG" "$LINK"
          sudo nginx -t
          sudo systemctl reload nginx

          echo "=== ACME WEBROOT CHECK ==="
          CHALLENGE_FILE="$ACME_ROOT/.well-known/acme-challenge/tce-domain-check"
          echo "tce-acme-ok" | sudo tee "$CHALLENGE_FILE" >/dev/null
          curl -fsS --max-time 10 "http://${DOMAIN}/.well-known/acme-challenge/tce-domain-check"
          sudo rm -f "$CHALLENGE_FILE"

          echo "=== HTTP CHECK ==="
          curl -fsS -I --max-time 10 "http://${DOMAIN}/"

          if [ "$SSL" = "true" ]; then
            command -v certbot >/dev/null || { echo "certbot is not installed"; exit 1; }

            # Use webroot mode instead of --nginx so Certbot never rewrites the proxy
            # server block temporarily. Nginx stays up during ACME validation.
            sudo certbot certonly \
              --webroot \
              -w "$ACME_ROOT" \
              --non-interactive \
              --agree-tos \
              --keep-until-expiring \
              -d "$DOMAIN"

            # Install the certificate explicitly into this vhost.
            CERT_DIR="/etc/letsencrypt/live/${DOMAIN}"
            cat > "$TMP" <<EOF
          server {
              listen 80;
              listen [::]:80;
              server_name ${DOMAIN};

              location ^~ /.well-known/acme-challenge/ {
                  root ${ACME_ROOT};
                  default_type text/plain;
                  try_files \$uri =404;
              }

              location / {
                  return 301 https://\$host\$request_uri;
              }
          }

          server {
              listen 443 ssl http2;
              listen [::]:443 ssl http2;
              server_name ${DOMAIN};

              ssl_certificate ${CERT_DIR}/fullchain.pem;
              ssl_certificate_key ${CERT_DIR}/privkey.pem;

              location / {
                  proxy_pass http://${UPSTREAM};
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
          }
          EOF

            sudo install -m 0644 "$TMP" "$CFG"
            sudo nginx -t
            sudo systemctl reload nginx
          fi

          echo "=== HTTPS CHECK ==="
          if [ "$SSL" = "true" ]; then
            curl -fsS -I --max-time 15 "https://${DOMAIN}/"
          else
            echo "SSL disabled; HTTPS check skipped."
          fi

          echo "=== TCE DOMAIN SETUP COMPLETE ==="
          echo "${DOMAIN} -> ${UPSTREAM}"
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/tce_vps_key
