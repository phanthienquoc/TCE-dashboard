name: "WF-06 TCE Staging Monitor"

"on":
  workflow_dispatch:
    inputs:
      host:
        description: "VPS IP/hostname"
        required: true
        default: "132.226.175.206"
        type: string
      username:
        description: "SSH username"
        required: true
        default: "ubuntu"
        type: string
  schedule:
    - cron: "*/5 * * * *"

env:
  NAMESPACE: "tce-stg"
  DEPLOYMENTS: "tce-service tce-frontend"

concurrency:
  group: tce-staging-monitor
  cancel-in-progress: true

jobs:
  monitor-staging:
    name: Check TCE STG k3s
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key
          ssh-keygen -y -f ~/.ssh/tce_vps_key >/dev/null

      - name: Collect STG health and diagnostics
        env:
          H: ${{ github.event.inputs.host || '132.226.175.206' }}
          U: ${{ github.event.inputs.username || 'ubuntu' }}
        run: |
          set -uo pipefail
          ssh -i ~/.ssh/tce_vps_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            "$U@$H" 'bash -s' <<'REMOTE'
          set -uo pipefail
          NS="tce-stg"
          FAILED=0

          echo "===== TCE STG MONITOR ====="
          date -Is
          echo "Host: $(hostname)"
          echo

          echo "===== NODES ====="
          sudo kubectl get nodes -o wide || FAILED=1
          echo

          echo "===== PODS ====="
          sudo kubectl -n "$NS" get pods -o wide || FAILED=1
          echo

          echo "===== DEPLOYMENTS ====="
          sudo kubectl -n "$NS" get deployments || FAILED=1
          echo

          echo "===== SERVICES / INGRESS ====="
          sudo kubectl -n "$NS" get svc,ingress || true
          echo

          echo "===== CONTAINER STATUS ====="
          sudo kubectl -n "$NS" get pods -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{range .status.containerStatuses[*]}{.name}{"="}{.ready}{" restart="}{.restartCount}{" reason="}{.state.waiting.reason}{" "}{end}{"\n"}{end}' || true
          echo

          echo "===== RECENT EVENTS ====="
          sudo kubectl -n "$NS" get events --sort-by='.lastTimestamp' | tail -80 || true
          echo

          echo "===== SERVICE LOGS ====="
          sudo kubectl -n "$NS" logs deployment/tce-service --all-containers=true --tail=120 || true
          echo

          echo "===== FRONTEND LOGS ====="
          sudo kubectl -n "$NS" logs deployment/tce-frontend --all-containers=true --tail=80 || true
          echo

          echo "===== HEALTH DECISION ====="
          for d in tce-service tce-frontend; do
            AVAILABLE=$(sudo kubectl -n "$NS" get deployment "$d" -o jsonpath='{.status.availableReplicas}' 2>/dev/null || echo 0)
            DESIRED=$(sudo kubectl -n "$NS" get deployment "$d" -o jsonpath='{.spec.replicas}' 2>/dev/null || echo 0)
            AVAILABLE=${AVAILABLE:-0}
            DESIRED=${DESIRED:-0}
            echo "$d: available=$AVAILABLE desired=$DESIRED"
            if [ "$AVAILABLE" != "$DESIRED" ]; then
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "TCE STG STATUS: UNHEALTHY"
            exit 1
          fi

          echo "TCE STG STATUS: HEALTHY"
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/tce_vps_key
