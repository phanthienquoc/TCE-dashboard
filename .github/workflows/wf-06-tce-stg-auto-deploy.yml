name: "WF-06 TCE STG Auto Deploy"

on:
  push:
    branches: [master]
    paths:
      - 'apps/**'
      - 'infra/k3s/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/wf-04-tce-staging-deploy.yml'
      - '.github/workflows/wf-06-tce-stg-auto-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-stg:
    uses: ./.github/workflows/wf-04-tce-staging-deploy.yml
    with:
      deploy: true
    secrets: inherit
