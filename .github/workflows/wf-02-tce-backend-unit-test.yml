name: TCE Backend Unit Tests

on:
  push:
    branches:
      - master
      - staging
      - development
  pull_request:
    branches:
      - master
      - staging
      - development
  workflow_dispatch:

concurrency:
  group: backend-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit-test:
    name: Backend unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Run backend unit tests
        run: npm test

      - name: Build backend
        run: npm run build:service
