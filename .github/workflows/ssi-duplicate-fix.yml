name: ssi-duplicate-fix
on:
  push:
    branches: [fix/ssi-clientid-duplicate]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate clientId
        shell: python
        run: |
          from pathlib import Path
          p=Path('libs/ssi/src/ssi.broker.adapter.ts')
          s=p.read_text()
          s=s.replace('        clientId,\n        clientId,\n        apiKey:', '        clientId,\n        apiKey:', 1)
          p.write_text(s)
      - name: Remove workflow and commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/ssi-duplicate-fix.yml
          git add -A
          git commit -m 'fix(ssi): remove duplicate clientId config' || exit 0
          git push origin HEAD:fix/ssi-clientid-duplicate
