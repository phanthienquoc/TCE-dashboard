name: WF-03 TCE Production Deploy
# Production release is limited to app/build inputs. Docs, plans, and workflow-only
# changes must not publish images or request GitOps promotion.
run-name: WF-03 TCE Production Deploy — ${{ github.ref_name }} — ${{ github.sha }}

on:
  # Production release requires explicit manual dispatch; ordinary pushes only run CI.
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  validate-release-ref:
    name: Require master for production release
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-master production releases
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Production releases must run from master; refusing image publication and GitOps promotion."
            exit 1
          fi

  notify-telegram-start:
    needs: validate-release-ref
    name: Notify Telegram — release started
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
    steps:
      - name: Validate Telegram configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing GitHub variable: TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing GitHub variable: TELEGRAM_CHAT_ID"; exit 1; }

      - name: Send deployment started message
        shell: bash
        run: |
          set -euo pipefail
          MESSAGE="$(cat <<EOF
          <pre>🚀 TCE • PRODUCTION RELEASE

          🌿 Branch    ${{ github.ref_name }}
          🔖 Commit    ${GITHUB_SHA::7}</pre>
          EOF
          )"

          curl --fail-with-body -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            -d "parse_mode=HTML"

  detect:
    name: Resolve production image tag
    needs: notify-telegram-start
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve immutable release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SHA="$GITHUB_SHA"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::package.json version must be stable semver (x.y.z)." >&2
            exit 1
          }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Expected the full immutable 40-character source SHA." >&2
            exit 1
          }
          IMAGE_TAG="prod-v${VERSION}-${SHA}"

          test "$IMAGE_TAG" = "prod-v${VERSION}-${SHA}"

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $IMAGE_TAG"

      - name: Write release metadata
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "$IMAGE_TAG" > /tmp/image-tag.txt

      - name: Upload release metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tce-release-metadata
          path: /tmp/image-tag.txt
          retention-days: 1

  build-frontend:
    name: Build frontend (native ARM64)
    needs: detect
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify native architecture
        run: test "$(uname -m)" = "aarch64"

      - name: Build frontend image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -t "tce-frontend:$IMAGE_TAG" -f Dockerfile .

      - name: Verify frontend architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect "tce-frontend:$IMAGE_TAG" --format '{{.Architecture}}')" = "arm64"

      - name: Export and validate frontend image
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/tce-frontend.tar /tmp/tce-frontend.sha256
          docker save "tce-frontend:$IMAGE_TAG" -o /tmp/tce-frontend.tar
          test -s /tmp/tce-frontend.tar
          sha256sum /tmp/tce-frontend.tar > /tmp/tce-frontend.sha256
          sha256sum -c /tmp/tce-frontend.sha256
          tar -tf /tmp/tce-frontend.tar >/dev/null

      - name: Upload frontend image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tce-frontend-image
          path: |
            /tmp/tce-frontend.tar
            /tmp/tce-frontend.sha256
          retention-days: 1

  build-backend:
    name: Build backend (native ARM64)
    needs: detect
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ needs.detect.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate backend inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/service/Dockerfile
          test -f tsconfig.base.json
          test -f nx.json
          test -d apps/service
          test -d libs
          test -d packages

      - name: Verify native architecture
        run: test "$(uname -m)" = "aarch64"

      - name: Build backend image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -t "tce-service:$IMAGE_TAG" -f apps/service/Dockerfile .

      - name: Verify backend architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect "tce-service:$IMAGE_TAG" --format '{{.Architecture}}')" = "arm64"

      - name: Export and validate backend image
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/tce-service.tar /tmp/tce-service.sha256
          docker save "tce-service:$IMAGE_TAG" -o /tmp/tce-service.tar
          test -s /tmp/tce-service.tar
          sha256sum /tmp/tce-service.tar > /tmp/tce-service.sha256
          sha256sum -c /tmp/tce-service.sha256
          tar -tf /tmp/tce-service.tar >/dev/null

      - name: Upload backend image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tce-service-image
          path: |
            /tmp/tce-service.tar
            /tmp/tce-service.sha256
          retention-days: 1

  platform-infra-release:
    name: Publish immutable images and promote platform-infra
    needs:
      - detect
      - build-frontend
      - build-backend
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      TAG: ${{ needs.detect.outputs.image_tag }}
      TOKEN: ${{ secrets.PLATFORM_INFRA_TOKEN }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download exact release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tce-*-image
          merge-multiple: true
          path: /tmp/images

      - name: Load and validate exact release images
        shell: bash
        run: |
          set -euo pipefail

          for image in tce-frontend tce-service; do
            test -s "/tmp/images/$image.tar"
            test -s "/tmp/images/$image.sha256"
            expected="$(awk '{print $1}' "/tmp/images/$image.sha256")"
            actual="$(sha256sum "/tmp/images/$image.tar" | awk '{print $1}')"
            test "$actual" = "$expected" || {
              echo "::error::Checksum mismatch for $image.tar"
              echo "Expected: $expected"
              echo "Actual:   $actual"
              exit 1
            }
            docker load -i "/tmp/images/$image.tar"
            docker image inspect "$image:$TAG" >/dev/null
            test "$(docker image inspect "$image:$TAG" --format '{{.Architecture}}')" = "arm64"
          done

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx for registry digest inspection
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Publish exact release images
        shell: bash
        run: |
          set -euo pipefail

          WEB_IMAGE="ghcr.io/phanthienquoc/tce-dashboard/web:$TAG"
          SERVICE_IMAGE="ghcr.io/phanthienquoc/tce-dashboard/service:$TAG"

          docker tag "tce-frontend:$TAG" "$WEB_IMAGE"
          docker tag "tce-service:$TAG" "$SERVICE_IMAGE"

          docker push "$WEB_IMAGE"
          docker push "$SERVICE_IMAGE"

      - name: Verify immutable registry digests and ARM64 manifests
        id: image-digests
        shell: bash
        env:
          TAG: ${{ needs.detect.outputs.image_tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^prod-v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{40}$ ]] || {
            echo "::error::Expected a full-source-SHA TCE release tag before registry verification." >&2
            exit 1
          }

          for component in web service; do
            image="ghcr.io/phanthienquoc/tce-dashboard/$component:$TAG"
            inspect="$(docker buildx imagetools inspect "$image")"
            if ! grep -Eq 'Platform: linux/arm64|linux/arm64' <<< "$inspect"; then
              echo "::error::Published TCE image $image has no linux/arm64 manifest." >&2
              printf '%s\\n' "$inspect" >&2
              exit 1
            fi

            digest="$(awk '/^Digest:/ {print $2; exit}' <<< "$inspect")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::Unable to resolve immutable registry digest for $image." >&2
              printf '%s\\n' "$inspect" >&2
              exit 1
            }
            echo "${component}_digest=$digest" >> "$GITHUB_OUTPUT"
            echo "Verified TCE $component: $digest (linux/arm64)"
          done

          grep -Eq '^web_digest=sha256:[0-9a-f]{64}$' "$GITHUB_OUTPUT"
          grep -Eq '^service_digest=sha256:[0-9a-f]{64}$' "$GITHUB_OUTPUT"

      - name: Validate TCE release handoff contract
        run: bash scripts/validate-tce-release-contract.sh
      - name: Notify platform-infra
        id: dispatch
        shell: bash
        env:
          WEB_DIGEST: ${{ steps.image-digests.outputs.web_digest }}
          SERVICE_DIGEST: ${{ steps.image-digests.outputs.service_digest }}
        run: |
          set -euo pipefail

          test -n "$TOKEN" || {
            echo "PLATFORM_INFRA_TOKEN is required for production GitOps promotion."
            exit 1
          }

          SOURCE_RUN_ID="$GITHUB_RUN_ID"
          SOURCE_WORKFLOW_PATH=".github/workflows/wf-03-tce-production-deploy.yml"
          SOURCE_EVENT="$GITHUB_EVENT_NAME"
          SOURCE_HEAD_SHA="$GITHUB_SHA"

          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::TCE source Actions run ID is invalid."
            exit 1
          }
          [[ "$SOURCE_EVENT" == "workflow_dispatch" ]] || {
            echo "::error::TCE production publisher must originate from workflow_dispatch."
            exit 1
          }
          [[ "$SOURCE_WORKFLOW_PATH" == ".github/workflows/wf-03-tce-production-deploy.yml" ]]
          [[ "$SOURCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_HEAD_SHA" == "$GITHUB_SHA" ]] || {
            echo "::error::TCE publisher source SHA is invalid."
            exit 1
          }
          [[ "$TAG" == *-"$SOURCE_HEAD_SHA" ]] || {
            echo "::error::TCE immutable release tag must contain the full source SHA."
            exit 1
          }
          [[ "$WEB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::TCE web registry digest is missing or malformed."
            exit 1
          }
          [[ "$SERVICE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::TCE service registry digest is missing or malformed."
            exit 1
          }

          payload="$(jq -cn \
            --arg app "tce-dashboard" \
            --arg release "$TAG" \
            --arg web_digest "$WEB_DIGEST" \
            --arg service_digest "$SERVICE_DIGEST" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_workflow_path "$SOURCE_WORKFLOW_PATH" \
            --arg source_event "$SOURCE_EVENT" \
            --arg source_head_sha "$SOURCE_HEAD_SHA" \
            '{event_type:"tce-release-requested",client_payload:{app:$app,release:$release,web_digest:$web_digest,service_digest:$service_digest,source_run_id:$source_run_id,source_workflow_path:$source_workflow_path,source_event:$source_event,source_head_sha:$source_head_sha}}')"
          jq -e \
            --arg app "tce-dashboard" \
            --arg release "$TAG" \
            --arg web_digest "$WEB_DIGEST" \
            --arg service_digest "$SERVICE_DIGEST" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_workflow_path "$SOURCE_WORKFLOW_PATH" \
            --arg source_event "$SOURCE_EVENT" \
            --arg source_head_sha "$SOURCE_HEAD_SHA" \
            '.event_type == "tce-release-requested" and .client_payload.app == $app and .client_payload.release == $release and .client_payload.web_digest == $web_digest and .client_payload.service_digest == $service_digest and .client_payload.source_run_id == $source_run_id and .client_payload.source_workflow_path == $source_workflow_path and .client_payload.source_event == $source_event and .client_payload.source_head_sha == $source_head_sha' \
            <<< "$payload" >/dev/null

          DISPATCHED_AT="$(date -u +%s)"
          echo "dispatched_at=$DISPATCHED_AT" >> "$GITHUB_OUTPUT"

          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/phanthienquoc/platform-infra/dispatches \
            -d "$payload"

      - name: Verify platform-infra release workflow
        shell: bash
        env:
          RELEASE: ${{ needs.detect.outputs.image_tag }}
          DISPATCHED_AT: ${{ steps.dispatch.outputs.dispatched_at }}
        run: |
          set -euo pipefail

          REPO="phanthienquoc/platform-infra"
          API="https://api.github.com/repos/$REPO/actions/runs"

          echo "Waiting for platform-infra repository_dispatch for $RELEASE..."

          for attempt in $(seq 1 12); do
            RUNS_JSON="$(curl --fail-with-body -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API?event=repository_dispatch&per_page=20")"

            MATCH="$(printf '%s' "$RUNS_JSON" | jq -r --argjson cutoff "$DISPATCHED_AT" --arg release "$RELEASE" '
              .workflow_runs[]
              | select(.created_at != null)
              | select((.created_at | fromdateiso8601) >= ($cutoff - 5))
              | select(.display_title == ("GitOps Image Promotion — tce-dashboard / " + $release))
              | [.id, .display_title, .status, .html_url]
              | @tsv
            ')"

            if [ -n "$MATCH" ]; then
              echo "Platform-infra workflow scheduled: $MATCH"
              exit 0
            fi

            echo "No matching platform-infra repository_dispatch workflow yet (attempt $attempt/12)."
            sleep 5
          done

          echo "::error::GitHub accepted the dispatch request, but platform-infra did not schedule the GitOps Image Promotion workflow within 60 seconds."
          echo "::error::Check PLATFORM_INFRA_TOKEN permissions and the platform-infra Actions workflow state."
          exit 1

      - name: Write release summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Platform Infra image release"
            echo ""
            echo "- Tag: $TAG"
            echo "- Web: ghcr.io/phanthienquoc/tce-dashboard/web@$WEB_DIGEST"
            echo "- Service: ghcr.io/phanthienquoc/tce-dashboard/service@$SERVICE_DIGEST"
            echo "- Release tag: $TAG"
            echo "- Event: tce-release-requested"
            echo "- Platform Infra: release request dispatched and GitOps Image Promotion workflow verified"
          } >> "$GITHUB_STEP_SUMMARY"
