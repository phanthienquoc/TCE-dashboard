name: "WF-10 TCE k3s Bootstrap"

on:
  workflow_call:
    secrets: inherit
  workflow_dispatch:
    inputs:
      host: { description: "VPS IP/hostname", required: true, default: "132.226.175.206" }
      username: { description: "SSH username", required: true, default: "ubuntu" }

env:
  TCE_STG_NAMESPACE: tce-stg
  TCE_PROD_NAMESPACE: tce-prod

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env: { KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }} }
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key
          ssh-keygen -y -f ~/.ssh/tce_vps_key >/dev/null
      - name: Preflight existing services
        env: { H: ${{ inputs.host || '132.226.175.206' }}, U: ${{ inputs.username || 'ubuntu' }} }
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          df -h /
          free -h
          sudo systemctl is-active nginx
          sudo nginx -t
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          REMOTE
      - name: Bootstrap k3s with Traefik
        env: { H: ${{ inputs.host || '132.226.175.206' }}, U: ${{ inputs.username || 'ubuntu' }} }
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if ! command -v k3s >/dev/null 2>&1; then curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --node-name tce-k3s-01" sh -; fi
          sudo systemctl enable --now k3s
          sudo kubectl create namespace tce-stg --dry-run=client -o yaml | sudo kubectl apply -f -
          sudo kubectl create namespace tce-prod --dry-run=client -o yaml | sudo kubectl apply -f -
          sudo kubectl label namespace tce-stg app.kubernetes.io/part-of=tce environment=stg --overwrite
          sudo kubectl label namespace tce-prod app.kubernetes.io/part-of=tce environment=prod --overwrite
          sudo kubectl -n kube-system get pods -l app.kubernetes.io/name=traefik
          REMOTE
      - name: Configure MFA secrets
        env:
          H: ${{ inputs.host || '132.226.175.206' }}
          U: ${{ inputs.username || 'ubuntu' }}
          MFA_STG: ${{ secrets.MFA_ENCRYPTION_KEY_STG }}
          MFA_PROD: ${{ secrets.MFA_ENCRYPTION_KEY_PROD }}
        run: |
          set -euo pipefail
          test -n "$MFA_STG"; test -n "$MFA_PROD"
          ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$U@$H" "MFA_STG='$MFA_STG' MFA_PROD='$MFA_PROD' bash -s" <<'REMOTE'
          set -euo pipefail
          sudo kubectl -n tce-stg create secret generic tce-auth --from-literal=MFA_ENCRYPTION_KEY="$MFA_STG" --dry-run=client -o yaml | sudo kubectl apply -f -
          sudo kubectl -n tce-prod create secret generic tce-auth --from-literal=MFA_ENCRYPTION_KEY="$MFA_PROD" --dry-run=client -o yaml | sudo kubectl apply -f -
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/tce_vps_key
