name: WF-10 TCE K3s Bootstrap

'on':
  workflow_call:
    secrets:
      VPS_SSH_PRIVATE_KEY:
        required: true
      MFA_ENCRYPTION_KEY_STG:
        required: true
  workflow_dispatch:
    inputs:
      host:
        description: 'VPS IP/hostname'
        required: true
        default: '132.226.175.206'
        type: string
      username:
        description: 'SSH username'
        required: true
        default: 'ubuntu'
        type: string

# This legacy bootstrap is staging-only. Production namespace and runtime-secret
# provisioning are owned by platform-infra GitOps reconciliation.
jobs:
  bootstrap:
    name: Bootstrap TCE staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          KEY: '${{ secrets.VPS_SSH_PRIVATE_KEY }}'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key
          ssh-keygen -y -f ~/.ssh/tce_vps_key >/dev/null

      - name: Preflight existing services
        env:
          H: "${{ inputs.host || '132.226.175.206' }}"
          U: "${{ inputs.username || 'ubuntu' }}"
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          df -h /
          free -h
          sudo systemctl is-active nginx
          sudo nginx -t
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          REMOTE

      - name: Bootstrap K3s with Traefik
        env:
          H: "${{ inputs.host || '132.226.175.206' }}"
          U: "${{ inputs.username || 'ubuntu' }}"
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if ! command -v k3s >/dev/null 2>&1; then
            curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --node-name tce-k3s-01" sh -
          fi
          sudo systemctl enable --now k3s
          sudo kubectl create namespace tce-stg --dry-run=client -o yaml | sudo kubectl apply -f -
          sudo kubectl label namespace tce-stg app.kubernetes.io/part-of=tce environment=stg --overwrite
          sudo kubectl -n kube-system get pods -l app.kubernetes.io/name=traefik
          REMOTE

      - name: Configure MFA secrets
        env:
          H: "${{ inputs.host || '132.226.175.206' }}"
          U: "${{ inputs.username || 'ubuntu' }}"
          MFA_STG: '${{ secrets.MFA_ENCRYPTION_KEY_STG }}'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MFA_STG"
          ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$U@$H" "MFA_STG='$MFA_STG' bash -s" <<'REMOTE'
          set -euo pipefail
          sudo kubectl -n tce-stg create secret generic tce-auth --from-literal=MFA_ENCRYPTION_KEY="$MFA_STG" --dry-run=client -o yaml | sudo kubectl apply -f -
          REMOTE

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f ~/.ssh/tce_vps_key
