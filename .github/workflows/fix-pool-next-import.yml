name: fix pool next import

on:
  push:
    branches: [feat/pool-to-next-position]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add dashboardApi import
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/web/app/dashboard/page.tsx')
          s=p.read_text()
          marker="import { platformApi } from '../../lib/api';\n"
          imp="import { dashboardApi, platformApi } from '../../lib/api';\n"
          if marker not in s: raise SystemExit('api import marker not found')
          s=s.replace(marker, imp, 1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/dashboard/page.tsx
          git rm .github/workflows/fix-pool-next-import.yml
          git commit -m "fix(web): import dashboardApi for pool promotion"
          git push origin HEAD:feat/pool-to-next-position
