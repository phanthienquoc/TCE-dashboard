name: "WF-01 TCE Build Verify"

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'Dockerfile'
      - 'apps/web/**'
      - 'apps/service/**'
      - 'infra/k3s/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    name: Build + Verify TCE images and PROD config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify required repository secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f package.json
          test -f apps/service/Dockerfile
          test -f apps/service/package.json
          test -f infra/k3s/frontend-prod.yaml
          test -f infra/k3s/service-prod.yaml
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY JWT_SECRET MFA_ENCRYPTION_KEY VPS_SSH_PRIVATE_KEY; do
            test -n "${!name}" || { echo "Missing required GitHub secret: $name"; exit 1; }
            echo "Secret present: $name"
          done

      - name: Build frontend image
        run: |
          set -euo pipefail
          docker build --pull -t tce-frontend:verify -f Dockerfile .
          docker image inspect tce-frontend:verify >/dev/null

      - name: Build backend image
        run: |
          set -euo pipefail
          # apps/service/Dockerfile is a monorepo build and requires the repository root as context.
          docker build --pull -t tce-service:verify -f apps/service/Dockerfile .
          docker image inspect tce-service:verify >/dev/null

      - name: Verify image metadata
        run: |
          set -euo pipefail
          docker image inspect tce-frontend:verify --format '{{.Config.ExposedPorts}}'
          docker image inspect tce-service:verify --format '{{.Config.ExposedPorts}}'

      - name: Verify Kubernetes YAML syntax
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir["infra/k3s/*-prod.yaml"].each { |f| YAML.parse_stream(File.read(f)); puts "OK #{f}" }'
