name: "WF-01 TCE Build Verify"

"on":
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'Dockerfile'
      - 'apps/web/**'
      - 'apps/service/**'
      - 'infra/k3s/**'
      - '.github/workflows/wf-01-tce-build-verify.yml'
      - '.github/workflows/wf-04-tce-staging-deploy.yml'
      - '.github/workflows/wf-05-tce-production-deploy.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build + Verify TCE images and STG secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify required STG repository secrets
        env:
          SUPABASE_URL_STG: ${{ secrets.SUPABASE_URL_STG }}
          SUPABASE_SERVICE_ROLE_KEY_STG: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STG }}
          JWT_SECRET_STG: ${{ secrets.JWT_SECRET_STG }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f package.json
          test -f index.html
          test -f apps/service/Dockerfile
          test -f apps/service/package.json
          test -d infra/k3s
          for name in SUPABASE_URL_STG SUPABASE_SERVICE_ROLE_KEY_STG JWT_SECRET_STG VPS_SSH_PRIVATE_KEY; do
            test -n "${!name}" || { echo "Missing required GitHub secret: $name"; exit 1; }
            echo "Secret present: $name"
          done

      - name: Build frontend image
        run: |
          set -euo pipefail
          docker build --pull -t tce-frontend:verify -f Dockerfile .
          docker image inspect tce-frontend:verify >/dev/null

      - name: Build backend image
        run: |
          set -euo pipefail
          docker build --pull -t tce-service:verify -f apps/service/Dockerfile apps/service
          docker image inspect tce-service:verify >/dev/null

      - name: Verify image metadata
        run: |
          set -euo pipefail
          docker image inspect tce-frontend:verify --format '{{.Config.ExposedPorts}}'
          docker image inspect tce-service:verify --format '{{.Config.ExposedPorts}}'

      - name: Verify Kubernetes YAML syntax
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir["infra/k3s/*.yaml"].each { |f| YAML.parse_stream(File.read(f)); puts "OK #{f}" }'
