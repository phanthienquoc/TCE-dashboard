name: WF-08 TCE Staging 3rd-Party Integration

on:
  workflow_dispatch:
    inputs:
      tce_stg_url:
        description: TCE staging domain; blank skips the staging check
        required: false
        default: ''
        type: string
      tce_stg_jwt:
        description: TCE staging JWT; blank skips the staging check
        required: false
        default: ''
        type: string
  schedule:
    - cron: '47 */6 * * *'

permissions:
  contents: read

concurrency:
  group: tce-staging-3rd-party-integration
  cancel-in-progress: false

env:
  BINANCE_TESTNET_BASE_URL: https://testnet.binancefuture.com

jobs:
  staging-3rd-party:
    name: TCE staging → 3rd-party
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TCE_STG_URL: ${{ github.event.inputs.tce_stg_url }}
      TCE_STG_JWT: ${{ github.event.inputs.tce_stg_jwt }}
    steps:
      - name: Validate optional staging inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TCE_STG_URL" ] || [ -z "$TCE_STG_JWT" ]; then
            echo 'TCE staging domain/JWT not provided.'
            echo 'System integration check: PASS (staging check skipped by design).'
            exit 0
          fi
          echo 'TCE staging inputs provided; running staging → 3rd-party integration.'

      - name: Check TCE staging → Binance Testnet
        if: ${{ env.TCE_STG_URL != '' && env.TCE_STG_JWT != '' }}
        shell: bash
        run: |
          set -euo pipefail
          base_url="${TCE_STG_URL%/}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --connect-timeout 10 --max-time 30 --request POST --header 'Accept: application/json' --header 'Content-Type: application/json' --header "Authorization: Bearer $TCE_STG_JWT" --data '{"environment":"testnet"}' "$base_url/api/platform/credentials/binance/test")"
          if [ "$http_code" != '200' ]; then
            echo "TCE staging → Binance Testnet failed with HTTP $http_code"
            jq -c '{statusCode, message, error}' "$response_file" 2>/dev/null || cat "$response_file"
            exit 1
          fi
          jq -e '.ok == true and .data.connected == true and .data.environment == "testnet"' "$response_file" >/dev/null
          echo 'TCE staging → Binance Testnet integration: OK'

      - name: Report staging integration result
        if: ${{ always() }}
        shell: bash
        run: echo 'WF-08 TCE staging 3rd-party integration completed.'
