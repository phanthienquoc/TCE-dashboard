name: "WF-04 TCE Staging Deploy"

"on":
  workflow_call:
    inputs:
      host:
        required: false
        type: string
        default: "132.226.175.206"
      username:
        required: false
        type: string
        default: "ubuntu"
    secrets:
      VPS_SSH_PRIVATE_KEY:
        required: true
      SUPABASE_URL_STG:
        required: true
      SUPABASE_SERVICE_ROLE_KEY_STG:
        required: true
      JWT_SECRET_STG:
        required: true
  workflow_dispatch:
    inputs:
      host:
        description: "VPS IP/hostname"
        required: true
        default: "132.226.175.206"
        type: string
      username:
        description: "SSH username"
        required: true
        default: "ubuntu"
        type: string

env:
  ENV_NAME: "stg"
  NAMESPACE: "tce-stg"
  TARGET_PLATFORM: "linux/arm64"

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 FE + BE images
        run: |
          set -euo pipefail
          # VPS is ARM64 (aarch64). Build exactly for the k3s node architecture.
          docker buildx build --platform "$TARGET_PLATFORM" --load \
            -t tce-frontend:stg -f Dockerfile .
          docker buildx build --platform "$TARGET_PLATFORM" --load \
            -t tce-service:stg -f apps/service/Dockerfile apps/service

          FE_ARCH="$(docker image inspect tce-frontend:stg --format '{{.Architecture}}/{{.Os}}')"
          BE_ARCH="$(docker image inspect tce-service:stg --format '{{.Architecture}}/{{.Os}}')"
          echo "Frontend image: $FE_ARCH"
          echo "Service image:  $BE_ARCH"
          test "$FE_ARCH" = "arm64/linux"
          test "$BE_ARCH" = "arm64/linux"

          docker save tce-frontend:stg tce-service:stg | gzip > /tmp/tce-stg-images.tar.gz

      - name: Configure SSH
        env:
          KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key
          ssh-keygen -y -f ~/.ssh/tce_vps_key >/dev/null

      - name: Deploy to k3s STG
        env:
          H: ${{ inputs.host || '132.226.175.206' }}
          U: ${{ inputs.username || 'ubuntu' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_STG }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STG }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_STG }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          test -n "$JWT_SECRET"
          scp -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no /tmp/tce-stg-images.tar.gz "$U@$H:/tmp/tce-stg-images.tar.gz"
          scp -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no infra/k3s/service-stg.yaml infra/k3s/frontend-stg.yaml "$U@$H:/tmp/"
          ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$U@$H" "SUPABASE_URL='$SUPABASE_URL' SUPABASE_KEY='$SUPABASE_KEY' JWT_SECRET='$JWT_SECRET' bash -s" <<'REMOTE'
          set -euo pipefail
          NS="tce-stg"

          sudo k3s ctr images import /tmp/tce-stg-images.tar.gz
          sudo kubectl -n "$NS" create secret generic tce-app-secrets \
            --from-literal=SUPABASE_URL="$SUPABASE_URL" \
            --from-literal=SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_KEY" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --dry-run=client -o yaml | sudo kubectl apply -f -

          sudo kubectl apply -f /tmp/service-stg.yaml -f /tmp/frontend-stg.yaml

          # The manifests intentionally use stable local tags + IfNotPresent because
          # images are imported directly into k3s containerd. Applying an unchanged
          # manifest does NOT restart an existing pod, so explicitly restart both
          # deployments after importing the new ARM64 images.
          sudo kubectl -n "$NS" rollout restart deployment/tce-service
          sudo kubectl -n "$NS" rollout restart deployment/tce-frontend

          if ! sudo kubectl -n "$NS" rollout status deployment/tce-service --timeout=180s; then
            echo "=== SERVICE DIAGNOSTICS ==="
            sudo kubectl -n "$NS" get pods -o wide || true
            sudo kubectl -n "$NS" describe pods || true
            sudo kubectl -n "$NS" logs deployment/tce-service --all-containers=true --tail=200 || true
            sudo kubectl -n "$NS" logs deployment/tce-service --all-containers=true --previous --tail=200 || true
            sudo kubectl -n "$NS" get events --sort-by='.lastTimestamp' | tail -100 || true
            exit 1
          fi

          if ! sudo kubectl -n "$NS" rollout status deployment/tce-frontend --timeout=180s; then
            echo "=== FRONTEND DIAGNOSTICS ==="
            sudo kubectl -n "$NS" get pods -o wide || true
            sudo kubectl -n "$NS" describe pods || true
            sudo kubectl -n "$NS" logs deployment/tce-frontend --all-containers=true --tail=200 || true
            sudo kubectl -n "$NS" logs deployment/tce-frontend --all-containers=true --previous --tail=200 || true
            sudo kubectl -n "$NS" get events --sort-by='.lastTimestamp' | tail -100 || true
            exit 1
          fi

          sudo kubectl -n "$NS" get pods,svc,ingress
          rm -f /tmp/tce-stg-images.tar.gz /tmp/service-stg.yaml /tmp/frontend-stg.yaml
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/tce_vps_key /tmp/tce-stg-images.tar.gz
