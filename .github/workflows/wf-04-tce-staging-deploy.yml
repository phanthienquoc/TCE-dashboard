name: "WF-04 TCE Staging Deploy"

"on":
  workflow_call:
    inputs:
      host:
        required: false
        type: string
        default: "132.226.175.206"
      username:
        required: false
        type: string
        default: "ubuntu"
    secrets:
      VPS_SSH_PRIVATE_KEY:
        required: true
      SUPABASE_URL_STG:
        required: true
      SUPABASE_SERVICE_ROLE_KEY_STG:
        required: true
      JWT_SECRET_STG:
        required: true
  workflow_dispatch:
    inputs:
      host:
        description: "VPS IP/hostname"
        required: true
        default: "132.226.175.206"
        type: string
      username:
        description: "SSH username"
        required: true
        default: "ubuntu"
        type: string

env:
  ENV_NAME: "stg"
  NAMESPACE: "tce-stg"
  TARGET_PLATFORM: "linux/arm64"

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="stg-v${VERSION}-${SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "TCE version: v$VERSION"
          echo "Git SHA: $SHA"
          echo "Image tag: $IMAGE_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 FE + BE images
        env:
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker buildx build --platform "$TARGET_PLATFORM" --load \
            -t "tce-frontend:$IMAGE_TAG" -f Dockerfile .
          docker buildx build --platform "$TARGET_PLATFORM" --load \
            -t "tce-service:$IMAGE_TAG" -f apps/service/Dockerfile apps/service

          FE_ARCH="$(docker image inspect "tce-frontend:$IMAGE_TAG" --format '{{.Architecture}}/{{.Os}}')"
          BE_ARCH="$(docker image inspect "tce-service:$IMAGE_TAG" --format '{{.Architecture}}/{{.Os}}')"
          echo "Frontend image: $FE_ARCH"
          echo "Service image:  $BE_ARCH"
          test "$FE_ARCH" = "arm64/linux"
          test "$BE_ARCH" = "arm64/linux"

          docker save "tce-frontend:$IMAGE_TAG" "tce-service:$IMAGE_TAG" | gzip > /tmp/tce-stg-images.tar.gz

      - name: Render versioned Kubernetes manifests
        env:
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tce-stg-manifests
          sed "s#tce-service:stg#tce-service:$IMAGE_TAG#g; s#path: /auth/status#path: /api/health#g" infra/k3s/service-stg.yaml > /tmp/tce-stg-manifests/service-stg.yaml
          sed "s#tce-frontend:stg#tce-frontend:$IMAGE_TAG#g" infra/k3s/frontend-stg.yaml > /tmp/tce-stg-manifests/frontend-stg.yaml
          grep -E 'image:|path:' /tmp/tce-stg-manifests/*.yaml

      - name: Configure SSH
        env:
          KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key
          ssh-keygen -y -f ~/.ssh/tce_vps_key >/dev/null

      - name: Deploy to k3s STG
        env:
          H: ${{ inputs.host || '132.226.175.206' }}
          U: ${{ inputs.username || 'ubuntu' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_STG }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STG }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_STG }}
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          test -n "$JWT_SECRET"
          scp -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no /tmp/tce-stg-images.tar.gz "$U@$H:/tmp/tce-stg-images.tar.gz"
          scp -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no /tmp/tce-stg-manifests/service-stg.yaml /tmp/tce-stg-manifests/frontend-stg.yaml "$U@$H:/tmp/"
          ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$U@$H" "SUPABASE_URL='$SUPABASE_URL' SUPABASE_KEY='$SUPABASE_KEY' JWT_SECRET='$JWT_SECRET' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          NS="tce-stg"
          SERVICE_IMAGE="tce-service:${IMAGE_TAG}"
          FRONTEND_IMAGE="tce-frontend:${IMAGE_TAG}"

          if sudo k3s ctr images list | awk '{print $1}' | grep -Fxq "$SERVICE_IMAGE" && \
             sudo k3s ctr images list | awk '{print $1}' | grep -Fxq "$FRONTEND_IMAGE"; then
            echo "Images already present: $IMAGE_TAG"
            echo "Skipping image import."
          else
            echo "New image tag detected: $IMAGE_TAG"
            echo "Importing ARM64 images..."
            sudo k3s ctr images import /tmp/tce-stg-images.tar.gz
          fi

          sudo kubectl -n "$NS" create secret generic tce-app-secrets \
            --from-literal=SUPABASE_URL="$SUPABASE_URL" \
            --from-literal=SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_KEY" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --dry-run=client -o yaml | sudo kubectl apply -f -

          sudo kubectl apply -f /tmp/service-stg.yaml -f /tmp/frontend-stg.yaml

          if ! sudo kubectl -n "$NS" rollout status deployment/tce-service --timeout=180s; then
            echo "=== SERVICE DIAGNOSTICS ==="
            sudo kubectl -n "$NS" get pods -o wide || true
            sudo kubectl -n "$NS" describe pods || true
            sudo kubectl -n "$NS" logs deployment/tce-service --all-containers=true --tail=200 || true
            sudo kubectl -n "$NS" logs deployment/tce-service --all-containers=true --previous --tail=200 || true
            sudo kubectl -n "$NS" get events --sort-by='.lastTimestamp' | tail -100 || true
            exit 1
          fi

          if ! sudo kubectl -n "$NS" rollout status deployment/tce-frontend --timeout=180s; then
            echo "=== FRONTEND DIAGNOSTICS ==="
            sudo kubectl -n "$NS" get pods -o wide || true
            sudo kubectl -n "$NS" describe pods || true
            sudo kubectl -n "$NS" logs deployment/tce-frontend --all-containers=true --tail=200 || true
            sudo kubectl -n "$NS" logs deployment/tce-frontend --all-containers=true --previous --tail=200 || true
            sudo kubectl -n "$NS" get events --sort-by='.lastTimestamp' | tail -100 || true
            exit 1
          fi

          sudo kubectl -n "$NS" get pods,svc,ingress
          rm -f /tmp/tce-stg-images.tar.gz /tmp/service-stg.yaml /tmp/frontend-stg.yaml
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/tce_vps_key /tmp/tce-stg-images.tar.gz /tmp/tce-stg-manifests/service-stg.yaml /tmp/tce-stg-manifests/frontend-stg.yaml
