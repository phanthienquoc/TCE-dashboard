name: "WF-04 TCE Staging Deploy"

"on":
  workflow_call:
    inputs:
      host: { required: false, type: string, default: "132.226.175.206" }
      username: { required: false, type: string, default: "ubuntu" }
      deploy: { required: false, type: boolean, default: true }
    secrets:
      VPS_SSH_PRIVATE_KEY: { required: true }
      SUPABASE_URL_STG: { required: true }
      SUPABASE_SERVICE_ROLE_KEY_STG: { required: true }
      JWT_SECRET_STG: { required: true }
      TCE_CREDENTIAL_ENCRYPTION_KEY_STG: { required: true }
      MFA_ENCRYPTION_KEY_STG: { required: true }
  workflow_dispatch:
    inputs:
      host: { description: "VPS IP/hostname", required: true, default: "132.226.175.206", type: string }
      username: { description: "SSH username", required: true, default: "ubuntu", type: string }
      deploy: { description: "Actually deploy changed components to STG", required: true, default: true, type: boolean }

env:
  NAMESPACE: tce-stg
  TARGET_PLATFORM: linux/arm64

jobs:
  build-fe:
    name: Build FE image (native ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: version
        name: Resolve image version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SHA="${GITHUB_SHA::7}"
          echo "image_tag=stg-v${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"
      - name: Build ARM64 FE image
        env: { IMAGE_TAG: "${{ steps.version.outputs.image_tag }}" }
        run: |
          set -euo pipefail
          docker buildx build --platform "$TARGET_PLATFORM" --cache-from type=gha,scope=tce-fe-stg --cache-to type=gha,mode=max,scope=tce-fe-stg -t "tce-frontend:$IMAGE_TAG" -f Dockerfile . --output type=docker,dest=/tmp/tce-frontend.tar
          gzip -f /tmp/tce-frontend.tar
      - uses: actions/upload-artifact@v4
        with: { name: tce-stg-fe-image, path: /tmp/tce-frontend.tar.gz, retention-days: 1 }

  build-be:
    name: Build BE image (fresh source, no stale cache)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: version
        name: Resolve image version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SHA="${GITHUB_SHA::7}"
          echo "image_tag=stg-v${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"
          echo "Building BE from commit: $GITHUB_SHA"
      - name: Build ARM64 BE image without cache
        env: { IMAGE_TAG: "${{ steps.version.outputs.image_tag }}" }
        run: |
          set -euo pipefail
          docker buildx build --no-cache --pull --platform "$TARGET_PLATFORM" -t "tce-service:$IMAGE_TAG" -f apps/service/Dockerfile . --output type=docker,dest=/tmp/tce-service.tar
          gzip -f /tmp/tce-service.tar
      - uses: actions/upload-artifact@v4
        with: { name: tce-stg-be-image, path: /tmp/tce-service.tar.gz, retention-days: 1 }

  deploy-staging:
    name: Deploy FE + BE to STG
    needs: [build-fe, build-be]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: tce-stg-fe-image, path: /tmp/tce-images }
      - uses: actions/download-artifact@v4
        with: { name: tce-stg-be-image, path: /tmp/tce-images }
      - id: version
        name: Resolve image version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SHA="${GITHUB_SHA::7}"
          echo "image_tag=stg-v${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"
      - name: Render Kubernetes manifests
        env: { IMAGE_TAG: "${{ steps.version.outputs.image_tag }}" }
        run: |
          set -euo pipefail
          mkdir -p /tmp/tce-stg-manifests
          sed "s#tce-service:stg#tce-service:$IMAGE_TAG#g" infra/k3s/service-stg.yaml > /tmp/tce-stg-manifests/service-stg.yaml
          sed "s#tce-frontend:stg#tce-frontend:$IMAGE_TAG#g" infra/k3s/frontend-stg.yaml > /tmp/tce-stg-manifests/frontend-stg.yaml
          grep -E 'image:|imagePullPolicy:' /tmp/tce-stg-manifests/*.yaml || true
      - name: Configure SSH
        env: { KEY: "${{ secrets.VPS_SSH_PRIVATE_KEY }}" }
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key
          ssh-keygen -y -f ~/.ssh/tce_vps_key >/dev/null
      - name: Deploy to k3s STG
        env:
          H: ${{ inputs.host || '132.226.175.206' }}
          U: ${{ inputs.username || 'ubuntu' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_STG }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STG }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_STG }}
          TCE_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.TCE_CREDENTIAL_ENCRYPTION_KEY_STG }}
          MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY_STG }}
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_KEY" && test -n "$JWT_SECRET"
          test -n "$TCE_CREDENTIAL_ENCRYPTION_KEY" && test -n "$MFA_ENCRYPTION_KEY"
          scp -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no /tmp/tce-images/tce-frontend.tar.gz /tmp/tce-images/tce-service.tar.gz /tmp/tce-stg-manifests/service-stg.yaml /tmp/tce-stg-manifests/frontend-stg.yaml "$U@$H:/tmp/"
          ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$U@$H" "SUPABASE_URL='$SUPABASE_URL' SUPABASE_KEY='$SUPABASE_KEY' JWT_SECRET='$JWT_SECRET' TCE_CREDENTIAL_ENCRYPTION_KEY='$TCE_CREDENTIAL_ENCRYPTION_KEY' MFA_ENCRYPTION_KEY='$MFA_ENCRYPTION_KEY' IMAGE_TAG='$IMAGE_TAG' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          NS="tce-stg"
          SERVICE_IMAGE="tce-service:${IMAGE_TAG}"
          FRONTEND_IMAGE="tce-frontend:${IMAGE_TAG}"

          import_fresh() {
            local image="$1" archive="$2"
            sudo k3s ctr images rm "$image" 2>/dev/null || true
            sudo k3s ctr images import "/tmp/$archive"
            sudo k3s ctr images list | awk '{print $1}' | grep -Fxq "$image"
          }

          import_fresh "$SERVICE_IMAGE" tce-service.tar.gz
          import_fresh "$FRONTEND_IMAGE" tce-frontend.tar.gz

          sudo kubectl -n "$NS" create secret generic tce-app-secrets \
            --from-literal=SUPABASE_URL="$SUPABASE_URL" \
            --from-literal=SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_KEY" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --dry-run=client -o yaml | sudo kubectl apply -f -
          sudo kubectl -n "$NS" create secret generic tce-auth \
            --from-literal=MFA_ENCRYPTION_KEY="$MFA_ENCRYPTION_KEY" \
            --from-literal=TCE_CREDENTIAL_ENCRYPTION_KEY="$TCE_CREDENTIAL_ENCRYPTION_KEY" \
            --dry-run=client -o yaml | sudo kubectl apply -f -

          sudo kubectl apply -f /tmp/service-stg.yaml -f /tmp/frontend-stg.yaml
          sudo kubectl -n "$NS" annotate deployment/tce-service tce.github.com/source-sha="$DEPLOY_SHA" tce.github.com/image-tag="$IMAGE_TAG" --overwrite
          sudo kubectl -n "$NS" annotate deployment/tce-frontend tce.github.com/source-sha="$DEPLOY_SHA" tce.github.com/image-tag="$IMAGE_TAG" --overwrite
          sudo kubectl -n "$NS" rollout restart deployment/tce-service
          sudo kubectl -n "$NS" rollout restart deployment/tce-frontend
          sudo kubectl -n "$NS" rollout status deployment/tce-service --timeout=180s
          sudo kubectl -n "$NS" rollout status deployment/tce-frontend --timeout=180s

          echo "=== STG DEPLOY PROVENANCE ==="
          sudo kubectl -n "$NS" get deployment/tce-service -o jsonpath='{.metadata.annotations.tce\.github\.com/source-sha}{" "}{.metadata.annotations.tce\.github\.com/image-tag}{"\n"}'
          sudo kubectl -n "$NS" get deployment/tce-service -o jsonpath='{range .spec.template.spec.containers[*]}{.name}{"="}{.image}{"\n"}{end}'
          sudo kubectl -n "$NS" get pods -l app=tce-service -o wide
          sudo kubectl -n "$NS" get pods,svc,ingress
          rm -f /tmp/tce-frontend.tar.gz /tmp/tce-service.tar.gz /tmp/service-stg.yaml /tmp/frontend-stg.yaml
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/tce_vps_key /tmp/tce-images/*.tar.gz /tmp/tce-stg-manifests/*.yaml
