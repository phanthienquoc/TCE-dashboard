name: Codex CI Auto-Fix

on:
  workflow_run:
    workflows:
      - "TCE Backend Unit Tests"
      - "WF-03 TCE Deploy Orchestrator"
      - "WF-04 TCE Staging Deploy"
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: codex-autofix-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  autofix:
    name: Diagnose and fix failed CI
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != 'master' &&
      github.event.workflow_run.head_branch != 'staging' &&
      github.event.workflow_run.head_branch != 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout failed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 20
          persist-credentials: true

      - name: Guard auto-fix attempts
        id: guard
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          COUNT="$(git log --format=%s -20 | grep -c '\[codex-auto-fix [12]/2\]' || true)"
          echo "existing_attempts=$COUNT"
          if [ "$COUNT" -ge 2 ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Download failed workflow logs
        if: steps.guard.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p .codex-ci
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > .codex-ci/failed.log || true
          tail -n 12000 .codex-ci/failed.log > .codex-ci/context.log
          {
            echo "workflow=${{ github.event.workflow_run.name }}"
            echo "run_id=$RUN_ID"
            echo "head_branch=${{ github.event.workflow_run.head_branch }}"
            echo "head_sha=${{ github.event.workflow_run.head_sha }}"
            echo
            cat .codex-ci/context.log
          } > .codex-ci/failure.txt

      - name: Run Codex auto-fix
        if: steps.guard.outputs.allowed == 'true'
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.3-codex
          effort: high
          sandbox: workspace-write
          safety-strategy: drop-sudo
          prompt: |
            You are the TCE CI auto-fix agent.

            A GitHub Actions workflow failed on a non-protected branch. Diagnose the failure from .codex-ci/failure.txt and inspect the repository.

            HARD RULES:
            - Fix only the failure shown by this workflow run.
            - Work only on the current branch. Never modify master, staging, or development.
            - Never access, print, or modify production credentials, secrets, SSH keys, Binance/SSI credentials, or .env secret values.
            - Never change deployment targets, VPS credentials, Kubernetes secrets, or production release gates merely to make CI green.
            - For WF-03/WF-04 failures caused by infrastructure, network, missing GitHub secrets, VPS availability, rollout timeouts, or credentials, DO NOT invent a code fix. Explain the blocker and make no commit.
            - Prefer the smallest correct code/workflow fix.
            - Run the most relevant unit tests, typecheck, or build after the change.
            - Do not weaken, delete, or skip tests to make the workflow pass.
            - Do not change CI assertions merely to match a broken implementation.
            - If no safe code fix exists, make no changes.

            If and only if a safe fix is required and validation passes, modify the working tree. Do not create or merge a PR yourself; this workflow will commit the validated changes to the existing branch.

            Failure context:
            -----
            ${{ github.event.workflow_run.name }} / run ${{ github.event.workflow_run.id }}
            -----
        env:
          CODEX_FAILURE_CONTEXT: .codex-ci/failure.txt

      - name: Commit validated fix
        if: steps.guard.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          rm -rf .codex-ci
          if git diff --quiet && git diff --cached --quiet; then
            echo "Codex made no changes; no commit needed."
            exit 0
          fi
          git config user.name "codex-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          ATTEMPT="$(git log --format=%s -20 | grep -c '\[codex-auto-fix [12]/2\]' || true)"
          NEXT=$((ATTEMPT + 1))
          if [ "$NEXT" -gt 2 ]; then NEXT=2; fi
          git commit -m "fix: auto-fix CI failure [codex-auto-fix ${NEXT}/2]"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          PR_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json name,conclusion,headBranch,url || true
          echo "Codex auto-fix branch: $PR_BRANCH"
