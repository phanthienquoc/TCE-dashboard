name: patch pool next position

on:
  push:
    branches: [feat/pool-to-next-position]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch dashboard UI
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/app/dashboard/page.tsx')
          s = p.read_text()
          s = s.replace('  Activity,\n', '  Activity,\n  AlertTriangle,\n')
          s = s.replace("  const [tradeBusy, setTradeBusy] = useState(false);\n", "  const [tradeBusy, setTradeBusy] = useState(false);\n  const [promoteBusy, setPromoteBusy] = useState<string | null>(null);\n  const [promoteError, setPromoteError] = useState('');\n")
          marker = "  const submitTrade = async (payload: {\n"
          fn = """  const promotePool = async (pool: any) => {\n    const poolId = String(pool?.id ?? '').trim();\n    if (!poolId) return;\n    setPromoteBusy(poolId);\n    setPromoteError('');\n    try {\n      await dashboardApi.promotePool(poolId);\n      await load();\n    } catch (err: any) {\n      setPromoteError(\n        err?.response?.data?.message ??\n          err?.response?.data?.error?.message ??\n          err?.message ??\n          'Unable to promote pool item'\n      );\n    } finally {\n      setPromoteBusy(null);\n    }\n  };\n\n"""
          s = s.replace(marker, fn + marker)
          s = s.replace('<AssetList rows={pools} kind="pool" onTrade={openTrade} />', '<AssetList rows={pools} kind="pool" onTrade={openTrade} onPromote={promotePool} promoteBusy={promoteBusy} />')
          s = s.replace('<AssetList rows={next} kind="candidate" />', '<AssetList rows={next} kind="candidate" />')
          s = s.replace('        {error && <div className="error-banner">{error}</div>}\n', '        {error && <div className="error-banner">{error}</div>}\n        {promoteError && <div className="error-banner">{promoteError}</div>}\n')
          old = """  onTrade?: (row: any) => void;\n}) {\n"""
          new = """  onTrade?: (row: any) => void;\n  onPromote?: (row: any) => void;\n  promoteBusy?: string | null;\n}) {\n"""
          s = s.replace(old, new)
          s = s.replace("  onTrade,\n}: {\n", "  onTrade,\n  onPromote,\n  promoteBusy,\n}: {\n")
          old_block = """            {isPool && onTrade ? (\n              <div className=\"flex shrink-0 items-center gap-1.5\">\n                <button\n                  type=\"button\"\n                  className=\"rounded-md border border-emerald-500/30 bg-emerald-500/10 px-2 py-1 text-xs font-semibold text-emerald-300 hover:bg-emerald-500/20\"\n                  onClick={() => onTrade({ ...row, __defaultSide: 'BUY' })}\n                >\n                  Buy\n                </button>\n                <button\n                  type=\"button\"\n                  className=\"rounded-md border border-rose-500/30 bg-rose-500/10 px-2 py-1 text-xs font-semibold text-rose-300 hover:bg-rose-500/20\"\n                  onClick={() => onTrade({ ...row, __defaultSide: 'SELL' })}\n                >\n                  Sell\n                </button>\n              </div>\n            ) : (\n              <ChevronRight className=\"size-4 shrink-0 text-[#675a70]\" />\n            )}\n"""
          new_block = """            {isPool && onTrade ? (\n              <div className=\"flex shrink-0 items-center gap-1.5\">\n                <button\n                  type=\"button\"\n                  className=\"rounded-md border border-emerald-500/30 bg-emerald-500/10 px-2 py-1 text-xs font-semibold text-emerald-300 hover:bg-emerald-500/20\"\n                  onClick={() => onTrade({ ...row, __defaultSide: 'BUY' })}\n                >\n                  Buy\n                </button>\n                <button\n                  type=\"button\"\n                  className=\"rounded-md border border-rose-500/30 bg-rose-500/10 px-2 py-1 text-xs font-semibold text-rose-300 hover:bg-rose-500/20\"\n                  onClick={() => onTrade({ ...row, __defaultSide: 'SELL' })}\n                >\n                  Sell\n                </button>\n                {onPromote && (\n                  <button\n                    type=\"button\"\n                    disabled={String(row.status ?? '').toUpperCase() === 'PROMOTED' || promoteBusy === String(row.id)}\n                    className=\"rounded-md border border-violet-500/30 bg-violet-500/10 px-2 py-1 text-xs font-semibold text-violet-200 hover:bg-violet-500/20 disabled:cursor-not-allowed disabled:opacity-40\"\n                    onClick={() => onPromote(row)}\n                  >\n                    {promoteBusy === String(row.id) ? '…' : String(row.status ?? '').toUpperCase() === 'PROMOTED' ? 'Next' : '→ Next'}\n                  </button>\n                )}\n              </div>\n            ) : isCandidate ? (\n              <div className=\"flex shrink-0 items-center gap-2\">\n                {Number(quantity ?? 0) < 100 && (\n                  <span\n                    title=\"Available amount is not enough to place a 100-share order\"\n                    aria-label=\"Warning: insufficient amount for a 100-share order\"\n                    className=\"grid size-7 place-items-center rounded-md border border-rose-500/60 bg-rose-500/10 text-rose-300\"\n                  >\n                    <AlertTriangle className=\"size-4\" />\n                  </span>\n                )}\n                <ChevronRight className=\"size-4 text-[#675a70]\" />\n              </div>\n            ) : (\n              <ChevronRight className=\"size-4 shrink-0 text-[#675a70]\" />\n            )}\n"""
          if old_block not in s:
              raise SystemExit('pool action block not found')
          s = s.replace(old_block, new_block)
          old_row = '<div key={row.id ?? `${symbol}-${i}`} className="asset-row">'
          new_row = '<div key={row.id ?? `${symbol}-${i}`} className={`asset-row ${isCandidate && Number(quantity ?? 0) < 100 ? \'border border-rose-500/60\' : \'\'}`}> '
          s = s.replace(old_row, new_row)
          p.write_text(s)
          PY
      - name: Commit and remove patch workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/dashboard/page.tsx
          git rm .github/workflows/patch-pool-next-position.yml
          git commit -m "feat(web): promote pool items to next positions"
          git push origin HEAD:feat/pool-to-next-position
