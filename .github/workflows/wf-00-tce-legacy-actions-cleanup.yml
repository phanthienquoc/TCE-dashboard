name: WF-00 TCE Legacy Actions Cleanup

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete non-WF legacy workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          total=0
          deleted=0

          while IFS=$'\t' read -r run_id run_name; do
            [[ -z "$run_id" ]] && continue
            total=$((total + 1))

            # TCE workflow convention: every retained workflow is named WF-XX ...
            if [[ "$run_name" != WF-* ]]; then
              echo "Deleting legacy workflow run: $run_id ($run_name)"
              gh api --method DELETE "repos/$REPO/actions/runs/$run_id"
              deleted=$((deleted + 1))
            fi
          done < <(
            gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .name] | @tsv'
          )

          echo "Inspected $total workflow runs; deleted $deleted non-WF legacy runs."
