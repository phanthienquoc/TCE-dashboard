name: "WF-11 TCE Nginx Rollback"

on:
  workflow_dispatch:
    inputs:
      host:
        description: "VPS IP/hostname"
        required: true
        default: "132.226.175.206"
      domain:
        description: "TCE domain to rollback"
        required: true
        default: "tce.mrcute.space"
      backup_file:
        description: "Optional exact backup path; blank = latest backup for domain"
        required: false
        default: ""

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key
          ssh-keygen -y -f ~/.ssh/tce_vps_key >/dev/null

      - name: Restore previous TCE Nginx config
        env:
          H: ${{ inputs.host }}
          D: ${{ inputs.domain }}
          BACKUP_INPUT: ${{ inputs.backup_file }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/tce_vps_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            ubuntu@"$H" "D='$D' BACKUP_INPUT='$BACKUP_INPUT' bash -s" <<'REMOTE'
          set -euo pipefail

          CFG="/etc/nginx/sites-available/${D}"
          LINK="/etc/nginx/sites-enabled/${D}"
          BACKUP_DIR="/var/backups/tce-nginx"

          echo "=== ROLLBACK PRECHECK ==="
          sudo nginx -t
          sudo systemctl is-active --quiet nginx

          if [ -n "$BACKUP_INPUT" ]; then
            BACKUP="$BACKUP_INPUT"
          else
            BACKUP="$(sudo find "$BACKUP_DIR" -maxdepth 1 -type f -name "*-${D}-*.conf" -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2-)"
          fi

          test -n "$BACKUP" || { echo "No rollback backup found for ${D}"; exit 1; }
          test -f "$BACKUP" || { echo "Backup does not exist: $BACKUP"; exit 1; }
          echo "Using backup: $BACKUP"

          if grep -qx 'MISSING' "$BACKUP"; then
            echo "Original TCE vhost did not exist. Disabling current link/config."
            sudo rm -f "$LINK"
            sudo rm -f "$CFG"
          else
            sudo install -m 0644 "$BACKUP" "$CFG"
            sudo ln -sfn "$CFG" "$LINK"
          fi

          sudo nginx -t
          sudo systemctl reload nginx
          sudo systemctl is-active --quiet nginx

          echo "=== ROLLBACK COMPLETE ==="
          echo "Restored: $BACKUP"
          echo "Nginx is active."
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/tce_vps_key
