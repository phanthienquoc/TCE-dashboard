name: "WF-10 TCE k3s Bootstrap"

on:
  workflow_dispatch:
    inputs:
      host:
        description: "VPS IP/hostname"
        required: true
        default: "132.226.175.206"
      username:
        description: "SSH username"
        required: true
        default: "ubuntu"

env:
  TCE_NAMESPACE: tce

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key
          ssh-keygen -y -f ~/.ssh/tce_vps_key >/dev/null

      - name: Preflight existing services and disk
        env:
          H: ${{ inputs.host }}
          U: ${{ inputs.username }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          df -h /
          free -h
          sudo systemctl is-active nginx
          sudo nginx -t
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          if command -v k3s >/dev/null 2>&1; then sudo k3s --version; else echo 'k3s not installed'; fi
          REMOTE

      - name: Bootstrap isolated single-node k3s
        env:
          H: ${{ inputs.host }}
          U: ${{ inputs.username }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          NODE_NAME='tce-k3s-01'
          NAMESPACE='tce'
          if ! command -v k3s >/dev/null 2>&1; then
            curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --node-name ${NODE_NAME} --disable traefik" sh -
          fi
          sudo systemctl enable --now k3s
          sudo kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | sudo kubectl apply -f -
          sudo kubectl label namespace "$NAMESPACE" app.kubernetes.io/part-of=tce --overwrite
          sudo kubectl get nodes -o wide
          sudo kubectl get namespace "$NAMESPACE"
          df -h /
          echo 'TCE k3s bootstrap complete. Existing Nginx/Docker services were not modified.'
          REMOTE

      - name: Configure STG/PROD MFA secrets in k3s
        env:
          H: ${{ inputs.host }}
          U: ${{ inputs.username }}
          MFA_STG: ${{ secrets.MFA_ENCRYPTION_KEY_STG }}
          MFA_PROD: ${{ secrets.MFA_ENCRYPTION_KEY_PROD }}
        run: |
          set -euo pipefail
          test -n "$MFA_STG"
          test -n "$MFA_PROD"
          ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$U@$H" "MFA_STG='$MFA_STG' MFA_PROD='$MFA_PROD' bash -s" <<'REMOTE'
          set -euo pipefail
          umask 077
          printf '%s' "$MFA_STG" | sudo kubectl -n tce create secret generic tce-auth-stg --from-literal=MFA_ENCRYPTION_KEY=- --dry-run=client -o yaml | sudo kubectl apply -f -
          printf '%s' "$MFA_PROD" | sudo kubectl -n tce create secret generic tce-auth-prod --from-literal=MFA_ENCRYPTION_KEY=- --dry-run=client -o yaml | sudo kubectl apply -f -
          sudo kubectl -n tce get secret tce-auth-stg tce-auth-prod
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/tce_vps_key
